    <script src="shared.js"></script>
    <script>
      // En dessous de 10€/mois, le montant mensuel devient peu lisible : on affiche alors
      // l'équivalent annuel s'il reste significatif. Au-dessus, le revenu mensuel reste
      // toujours prioritaire afin de montrer immédiatement ce que gagne l'investisseur.
      function scpiFlowRevenu(monthly) {
        const annual = monthly * 12;
        if (monthly >= 10) return { value: monthly, unit: "/mois", annual, showAnnual: monthly < 100 };
        if (annual >= 100) return { value: annual, unit: "/an", annual, showAnnual: false };
        return null;
      }

      // Pour le versement initial uniquement : l'annuel est prioritaire sous
      // 100 €/mois, tandis que l'équivalent mensuel reste visible en dessous.
      function scpiImmediateFlowRevenu(monthly) {
        if (!Number.isFinite(monthly) || monthly <= 0) return null;
        const annual = monthly * 12;
        if (monthly < 100) {
          return { value: annual, unit: "/an", secondaryValue: monthly, secondaryPeriod: "par mois" };
        }
        return { value: monthly, unit: "/mois", secondaryValue: annual, secondaryPeriod: "par an" };
      }

      const defaults = {
        scpi: {
          rendement: 5,
          versementInitial: 10000,
          versementMensuel: 300,
          dureeVersements: 30,
          dureeTotale: 50,
          reinvestir: false,
          tmi: 30
        },
        av: {
          capitalInitial: 10000,
          versementMensuel: 500,
          dureeTotale: 30,
          rendement: 3,
          frais: 0.6,
          fraisActifs: false,
          fraisEntree: 0,
          fraisEntreeActifs: false,
          tauxLivretA: 1.7
        }
      };

      const params = new URLSearchParams(window.location.search);
      const requestedMode = params.get("mode");
      if (requestedMode === "per") window.location.replace("../simulateurs.html");
      const initialMode = ["av", "scpi"].includes(requestedMode) ? requestedMode : "av";

      const state = {
        mode: initialMode,
        view: "chart",
        values: structuredClone(defaults),
        previousGauge: {},
        compareView: "ecart"
      };
      const scpiContributionReveals = {
        immediate: { pending: false, animateNext: false, timer: 0 },
        viager: { pending: false, animateNext: false, timer: 0 }
      };
      document.body.dataset.mode = state.mode;

      const modeContent = {
        av: {
          label: "Assurance Vie",
          title: "Assurance Vie",
          description: "Projection de l'encours dans le temps et visualisation des intérêts composés.",
          chartTitle: "Encours projeté"
        },
        scpi: {
          label: "SCPI",
          title: "SCPI",
          description: "Projection des loyers perçus par mois et par an, et de leur progression dans le temps.",
          chartTitle: "Évolution des loyers perçus"
        }
      };

      // Prélèvements sociaux en vigueur, appliqués aux revenus fonciers (SCPI françaises).
      const PS_RATE = 17.2;

      function computeScpi(values) {
        const rows = [];
        let versementsCumules = 0;
        let capital = 0;
        let revenusCumules = 0;
        // Seule la part nette de fiscalité (TMI + prélèvements sociaux) d'un dividende
        // réinvesti se capitalise réellement : voir skill scpi-capitalisation.
        const tauxImposition = (values.tmi + PS_RATE) / 100;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = annee <= values.dureeVersements ? values.versementMensuel * 12 : 0;
          if (annee === 1) {
            versementsCumules = values.versementInitial + versementAnnuel;
            capital = versementsCumules;
          } else {
            versementsCumules += versementAnnuel;
            capital += versementAnnuel;
          }

          const revenuAnnuel = capital * (values.rendement / 100);
          const revenuMensuel = revenuAnnuel / 12;
          revenusCumules += revenuAnnuel;

          if (values.reinvestir && annee <= values.dureeVersements) {
            const revenuReinvesti = revenuAnnuel * (1 - tauxImposition);
            capital += revenuReinvesti;
            versementsCumules += revenuReinvesti;
          }

          rows.push({
            annee,
            versementsCumules,
            versementAnnuel,
            revenuMensuel,
            revenuAnnuel,
            revenusCumules,
            capital
          });
        }
        return rows;
      }

      function computeAssuranceVie(values) {
        const rows = [];
        const rendementNet = Math.max(
          0,
          values.rendement
            - (values.fraisActifs ? values.frais : 0)
        );
        const entreeNet = 1 - (values.fraisEntreeActifs ? values.fraisEntree / 100 : 0);
        let versementsCumules = 0;
        let interetsCumules = 0;
        let capital = 0;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = values.versementMensuel * 12;
          const versementAnnuelNet = versementAnnuel * entreeNet;
          if (annee === 1) {
            const capitalInitialNet = values.capitalInitial * entreeNet;
            versementsCumules = values.capitalInitial + versementAnnuel;
            const interetsAnnuels = capitalInitialNet * (rendementNet / 100);
            interetsCumules += interetsAnnuels;
            capital = capitalInitialNet + versementAnnuelNet + interetsAnnuels;
            rows.push({ annee, versementsCumules, versementAnnuel, interetsAnnuels, interetsCumules, capital });
          } else {
            versementsCumules += versementAnnuel;
            const interetsAnnuels = capital * (rendementNet / 100);
            interetsCumules += interetsAnnuels;
            capital = capital + versementAnnuelNet + interetsAnnuels;
            rows.push({ annee, versementsCumules, versementAnnuel, interetsAnnuels, interetsCumules, capital });
          }
        }
        return rows;
      }

      // Même effort d'épargne (versement initial + mensuel) que l'assurance vie,
      // mais placé sur un Livret bancaire : sert de point de comparaison "sans risque".
      function computeLivretA(values) {
        const rows = [];
        let versementsCumules = 0;
        let capital = 0;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = values.versementMensuel * 12;
          if (annee === 1) {
            versementsCumules = values.capitalInitial + versementAnnuel;
            const interetsAnnuels = values.capitalInitial * (values.tauxLivretA / 100);
            capital = values.capitalInitial + versementAnnuel + interetsAnnuels;
            rows.push({ annee, versementsCumules, capital });
          } else {
            versementsCumules += versementAnnuel;
            const interetsAnnuels = capital * (values.tauxLivretA / 100);
            capital = capital + versementAnnuel + interetsAnnuels;
            rows.push({ annee, versementsCumules, capital });
          }
        }
        return rows;
      }

      const fieldDefinitions = {
        scpi: [
          { key: "rendement", label: "Taux de distribution", type: "number", min: 0, max: 15, step: 0.1, suffix: "%" },
          { key: "versementInitial", label: "Versement initial", type: "number", min: 0, max: 500000, step: 1000, suffix: "€" },
          { key: "versementMensuel", label: "Versement mensuel", type: "number", min: 0, max: 5000, step: 50, suffix: "€" },
          { key: "dureeVersements", label: "Durée des versements", type: "number", min: 0, max: 50, step: 1, suffix: "ans" },
          { key: "dureeTotale", label: "Durée totale", type: "number", min: 0, max: 80, step: 1, suffix: "ans" },
          { key: "reinvestir", label: "Réinvestir les loyers", type: "checkbox", checkedNote: "Les loyers sont réinjectés dans le capital pendant la période de versement, puis vous sont versés.\nCe calcul réinvestit les loyers nets de fiscalité (TMI + prélèvements sociaux de 17,2 %)." },
          { key: "tmi", label: "Tranche marginale d'imposition (TMI)", type: "number", steps: [0, 11, 30, 41, 45], suffix: "%", dependsOn: "reinvestir" }
        ],
        av: [
          { key: "capitalInitial", label: "Versement initial", type: "number", min: 0, max: 500000, step: 1000, suffix: "€" },
          { key: "versementMensuel", label: "Versement mensuel", type: "number", min: 0, max: 10000, step: 50, suffix: "€" },
          { key: "rendement", label: "Rendement annuel", type: "number", min: 0, max: 15, step: 0.1, suffix: "%" },
          { key: "dureeTotale", label: "Durée totale", type: "number", min: 0, max: 60, step: 1, suffix: "ans" },
          { key: "fraisEntreeActifs", label: "Droits d'entrée", type: "checkbox" },
          { key: "fraisEntree", label: "Taux des droits d'entrée", type: "number", min: 0, max: 4.8, step: 0.1, suffix: "%", dependsOn: "fraisEntreeActifs" },
          { key: "fraisActifs", label: "Frais de gestion annuels", type: "checkbox" },
          { key: "frais", label: "Taux de frais de gestion", type: "number", min: 0, max: 3, step: 0.1, suffix: "%", dependsOn: "fraisActifs" }
        ]
      };

      function rowsForMode() {
        if (state.mode === "scpi") return computeScpi(state.values.scpi);
        return computeAssuranceVie(state.values.av);
      }

      function updateScpiReinvestment(nextValue, { preserveChartPosition = false } = {}) {
        const panel = document.querySelector("#chart-panel");
        const chart = document.querySelector("#chart");
        const panelRect = panel?.getBoundingClientRect();
        const chartIsVisible = panelRect
          ? panelRect.bottom > 0 && panelRect.top < window.innerHeight
          : false;
        const anchorTop = (preserveChartPosition || chartIsVisible) && panelRect ? panelRect.top : null;
        const lockedHeight = panelRect?.height || 0;

        // Le rendu du graphique et celui des hypothèses sont synchronisés, mais la
        // carte conserve ici son encombrement exact pendant le remplacement du SVG.
        // Cela évite que l'ancrage automatique du navigateur ne déplace la fenêtre.
        if (panel && lockedHeight) {
          panel.style.height = `${lockedHeight}px`;
          panel.classList.add("is-scenario-updating");
        }

        state.values.scpi.reinvestir = Boolean(nextValue);

        // Le champ TMI (dépendant de "reinvestir") apparaît/disparaît, donc le
        // panneau d'hypothèses est reconstruit, avec une transition de hauteur
        // pour éviter un saut brusque de mise en page.
        withHeightTransition(document.querySelector(".tool-params"), renderFields);
        renderOutputs();

        const restoreAnchor = () => {
          if (anchorTop === null || !panel) return;
          const delta = panel.getBoundingClientRect().top - anchorTop;
          if (Math.abs(delta) > 0.5) window.scrollBy({ top: delta, left: 0, behavior: "instant" });
        };

        restoreAnchor();
        requestAnimationFrame(() => {
          restoreAnchor();
          if (!panel) return;
          panel.classList.remove("is-scenario-updating");
          requestAnimationFrame(restoreAnchor);
        });
      }

      function releaseScpiChartHeightLock() {
        const panel = document.querySelector("#chart-panel");
        if (!panel) return;
        panel.style.height = "";
        panel.classList.remove("is-scenario-updating");
      }

      let outputsRenderFrame = 0;

      function scheduleRenderOutputs() {
        if (outputsRenderFrame) return;
        releaseScpiChartHeightLock();
        outputsRenderFrame = requestAnimationFrame(() => {
          outputsRenderFrame = 0;
          renderOutputs();
        });
      }

      function queueScpiContributionReveal(flow, fieldKey, previousValue, nextValue) {
        if (state.mode !== "scpi") return;
        const reveal = scpiContributionReveals[flow];
        if (!reveal) return;
        const wasVisible = Number(previousValue) > 0;
        const isVisible = Number(nextValue) > 0;

        if (!isVisible) {
          window.clearTimeout(reveal.timer);
          reveal.timer = 0;
          reveal.pending = false;
          reveal.animateNext = false;
          return;
        }

        if (!wasVisible || reveal.pending) {
          reveal.pending = true;
          reveal.animateNext = false;
          window.clearTimeout(reveal.timer);
          reveal.timer = window.setTimeout(() => {
            reveal.timer = 0;
            if (Number(state.values.scpi[fieldKey]) <= 0) return;
            reveal.pending = false;
            reveal.animateNext = true;
            renderOutputs();
          }, 120);
        }
      }

      function renderFields() {
        const fields = document.querySelector("#fields");
        const values = state.values[state.mode];
        const fieldRefreshers = [];
        fields.innerHTML = "";

        const handleFieldValueChange = (key, previousValue, nextValue) => {
          if (key === "versementInitial") {
            queueScpiContributionReveal("immediate", key, previousValue, nextValue);
          } else if (key === "versementMensuel") {
            queueScpiContributionReveal("viager", key, previousValue, nextValue);
          }
          scheduleRenderOutputs();
        };
        const handleFieldCommit = () => {
          releaseScpiChartHeightLock();
          renderOutputs();
        };

        const renderSelectField = (field) => {
          const label = document.createElement("label");
          label.className = "tool-field tool-select-field";

          const span = document.createElement("span");
          span.textContent = typeof field.label === "function" ? field.label(values) : field.label;

          const control = document.createElement("div");
          control.className = "tool-select-wrap";
          const select = document.createElement("select");
          select.setAttribute("aria-label", span.textContent);
          field.options.forEach((optionValue) => {
            const option = document.createElement("option");
            option.value = optionValue;
            const unit = optionValue === 1 ? "part" : "parts";
            option.textContent = `${formatInputNumber(optionValue)} ${unit}`;
            option.selected = values[field.key] === optionValue;
            select.append(option);
          });
          select.addEventListener("change", () => {
            values[field.key] = Number(select.value);
            renderOutputs();
          });
          control.append(select);
          label.append(span, control);
          return label;
        };

        const renderFees = () => {
          const feeGroup = document.createElement("div");
          feeGroup.className = "tool-fee-group";

          [
            {
              toggleKey: "fraisEntreeActifs",
              valueKey: "fraisEntree",
              label: "Droits d'entrée",
              rateLabel: "Taux",
              max: 4.8
            },
            {
              toggleKey: "fraisActifs",
              valueKey: "frais",
              label: "Frais de gestion",
              rateLabel: "Taux annuel",
              max: 3
            }
          ].forEach((fee) => {
            const card = document.createElement("div");
            card.className = "tool-fee-card";
            const toggle = document.createElement("label");
            toggle.className = "tool-fee-toggle";
            const title = document.createElement("span");
            title.textContent = fee.label;
            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = values[fee.toggleKey];
            input.addEventListener("change", () => {
              values[fee.toggleKey] = input.checked;
              withHeightTransition(document.querySelector(".tool-params"), () => {
                renderFields();
                renderOutputs();
              });
            });
            toggle.append(title, input);
            card.append(toggle);

            if (values[fee.toggleKey]) {
              card.append(renderNumberField({
                key: fee.valueKey,
                label: fee.rateLabel,
                type: "number",
                min: 0,
                max: fee.max,
                step: 0.1,
                suffix: "%"
              }, values, fieldRefreshers, {
                mini: true,
                onValueChange: handleFieldValueChange,
                onCommit: handleFieldCommit
              }));
            }

            feeGroup.append(card);
          });

          fields.append(feeGroup);
        };

        fieldDefinitions[state.mode].forEach((field) => {
          if (field.dependsOn && !values[field.dependsOn]) return;
          if (state.mode === "av" && ["fraisEntreeActifs", "fraisEntree", "fraisActifs", "frais"].includes(field.key)) return;

          if (field.type === "select") {
            fields.append(renderSelectField(field));
            return;
          }

          if (field.type !== "checkbox") {
            fields.append(renderNumberField(field, values, fieldRefreshers, {
              onValueChange: handleFieldValueChange,
              onCommit: handleFieldCommit
            }));
            return;
          }

          const label = document.createElement("label");
          label.className = "tool-switch-row";

          const span = document.createElement("span");
          span.textContent = typeof field.label === "function" ? field.label(values) : field.label;
          label.append(span);

          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = values[field.key];
          input.dataset.checkboxField = field.key;
          input.addEventListener("change", () => {
            if (state.mode === "scpi" && field.key === "reinvestir") {
              updateScpiReinvestment(input.checked);
              return;
            }
            values[field.key] = input.checked;
            withHeightTransition(document.querySelector(".tool-params"), render);
          });
          label.append(input);

          fields.append(label);

          if (field.checkedNote) {
            const note = document.createElement("small");
            note.className = "tool-field-note";
            note.dataset.noteFor = field.key;
            note.classList.toggle("is-visible", Boolean(values[field.key]));
            note.setAttribute("aria-hidden", String(!values[field.key]));
            note.textContent = field.checkedNote;
            fields.append(note);
          }
        });

        if (state.mode === "av") renderFees();
      }

      function animateFormattedNumber(element, target, formatter, duration = 420) {
        if (!element) return;

        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const storedValue = Number(element.dataset.value);
        const startValue = Number.isFinite(element._displayValue)
          ? element._displayValue
          : Number.isFinite(storedValue) ? storedValue : target;
        const token = (element._valueAnimationToken = (element._valueAnimationToken || 0) + 1);

        if (reducedMotion || !Number.isFinite(startValue) || Math.abs(target - startValue) < 0.001) {
          element._displayValue = target;
          element.dataset.value = target;
          element.textContent = formatter(target);
          element.classList.remove("is-number-updating");
          return;
        }

        const startedAt = performance.now();
        element.classList.add("is-number-updating");

        const update = (now) => {
          if (element._valueAnimationToken !== token) return;
          const progress = Math.min(1, (now - startedAt) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = startValue + (target - startValue) * eased;

          element._displayValue = current;
          element.dataset.value = current;
          element.textContent = formatter(current);

          if (progress < 1) {
            requestAnimationFrame(update);
            return;
          }

          element._displayValue = target;
          element.dataset.value = target;
          element.textContent = formatter(target);
          element.classList.remove("is-number-updating");
        };

        requestAnimationFrame(update);
      }

      function renderSummary(rows) {
        const last = rows.at(-1) || {};
        const summary = document.querySelector("#summary");

        if (state.mode === "av") {
          const capital = last.capital || 0;
          const invested = last.versementsCumules || 0;
          const interests = last.interetsCumules || 0;
          const investedShare = capital > 0 ? Math.max(0, Math.min(100, (invested / capital) * 100)) : 0;
          const interestsShare = Math.max(0, 100 - investedShare);
          const multiple = invested > 0 ? capital / invested : 0;
          const existingResult = summary.querySelector(".av-result");

          if (existingResult) {
            const updateNumber = (key, target, formatter) => {
              animateFormattedNumber(existingResult.querySelector(`[data-av-value="${key}"]`), target, formatter);
            };

            updateNumber("capital", capital, formatMoney);
            updateNumber("invested-share", investedShare, (value) => `${formatNumber(value)} %`);
            updateNumber("interests-share", interestsShare, (value) => `${formatNumber(value)} %`);
            updateNumber("invested", invested, formatMoney);
            updateNumber("interests", interests, formatMoney);
            updateNumber("multiple", multiple, (value) => `× ${value.toFixed(2)}`);

            const [investedBar, interestsBar] = existingResult.querySelectorAll(".capital-breakdown > div");
            if (investedBar) investedBar.style.width = `${investedShare}%`;
            if (interestsBar) interestsBar.style.width = `${interestsShare}%`;
            return;
          }

          summary.innerHTML = `
            <article class="tool-result-card tool-result-editorial av-result">
              <div class="tool-summary-title">
                <h2>Projection</h2>
              </div>
              <div class="tool-hero tool-hero-single">
                <div class="tool-hero-panel tool-hero-panel-blue">
                  <span class="tool-hero-label">Capital final estimé</span>
                  <strong class="tool-hero-amount value-update" data-av-value="capital" data-value="${capital}">${formatMoney(capital)}</strong>
                </div>
              </div>
              <div class="capital-gauge">
                <div class="capital-breakdown-labels">
                  <span class="capital-metric-invested"><em>Sommes investies</em><strong data-av-value="invested-share" data-value="${investedShare}">${formatNumber(investedShare)} %</strong></span>
                  <span class="capital-metric-interest"><em>Intérêts gagnés</em><strong data-av-value="interests-share" data-value="${interestsShare}">${formatNumber(interestsShare)} %</strong></span>
                </div>
                <div class="capital-breakdown" aria-label="Répartition du capital final">
                  <div style="width:${investedShare}%"></div>
                  <div style="width:${interestsShare}%"></div>
                </div>
              </div>
              <div class="capital-metrics">
                <span class="capital-metric-invested"><small>Sommes investies</small><strong class="value-update" data-av-value="invested" data-value="${invested}">${formatMoney(invested)}</strong></span>
                <span class="capital-metric-interest"><small>Intérêts gagnés</small><strong class="value-update" data-av-value="interests" data-value="${interests}">${formatMoney(interests)}</strong></span>
                <span class="capital-metric-multiple"><small>Multiple obtenu</small><strong class="value-update" data-av-value="multiple" data-value="${multiple}">× ${multiple.toFixed(2)}</strong></span>
              </div>
            </article>
          `;
          return;
        }

        if (state.mode === "scpi") {
          const values = state.values.scpi;
          const loyerMensuelFin = last.revenuMensuel || 0;
          const totalLoyers = last.revenusCumules || 0;
          const effortMensuel = values.versementMensuel;
          const capitalFinal = last.capital || 0;
          const partInitiale = capitalFinal > 0 ? values.versementInitial / capitalFinal : 0;
          const revenuInitial = loyerMensuelFin * partInitiale;
          const revenuEffort = loyerMensuelFin - revenuInitial;
          const immediateFlow = scpiImmediateFlowRevenu(revenuInitial);
          const viagerFlow = scpiFlowRevenu(revenuEffort);
          const hasInitialPayment = Number(values.versementInitial) > 0;
          const hasScheduledPayment = Number(values.versementMensuel) > 0;
          const initialReveal = scpiContributionReveals.immediate;
          const scheduledReveal = scpiContributionReveals.viager;
          if (!hasInitialPayment) {
            window.clearTimeout(initialReveal.timer);
            initialReveal.timer = 0;
            initialReveal.pending = false;
            initialReveal.animateNext = false;
          }
          if (!hasScheduledPayment) {
            window.clearTimeout(scheduledReveal.timer);
            scheduledReveal.timer = 0;
            scheduledReveal.pending = false;
            scheduledReveal.animateNext = false;
          }
          const showInitialPayment = hasInitialPayment && !initialReveal.pending;
          const showScheduledPayment = hasScheduledPayment && !scheduledReveal.pending;
          const animateInitialPayment = showInitialPayment && initialReveal.animateNext;
          const animateScheduledPayment = showScheduledPayment && scheduledReveal.animateNext;
          const moneyMarkup = (amount) => `<span class="scpi-money-value">${formatMoney(amount).replace(/\s?€$/, "")}</span><small class="scpi-money-unit">€</small>`;
          const flowSecondaryMarkup = (flow) => {
            if (flow.secondaryValue !== undefined) {
              return `<span class="scpi-flow-annual"><span>soit </span>${moneyMarkup(flow.secondaryValue)}<span> ${flow.secondaryPeriod}</span></span>`;
            }
            if (flow.showAnnual) return `<span class="scpi-flow-annual">${moneyMarkup(flow.annual)}<span> par an</span></span>`;
            return "";
          };
          const flowAmountMarkup = (flow) => `
            <strong class="scpi-flow-amount value-update">${moneyMarkup(flow.value)}<small class="scpi-flow-period">${flow.unit}</small></strong>
            ${flowSecondaryMarkup(flow)}
          `;

          summary.innerHTML = `
            <article class="tool-result-card tool-result-editorial">
              <div class="tool-summary-title">
                <h2>Projection</h2>
              </div>
              <div class="tool-hero">
                <div class="tool-hero-panel tool-hero-panel-blue">
                  <span class="tool-hero-label">Patrimoine immobilier final</span>
                  <strong class="tool-hero-amount value-update">${moneyMarkup(last.capital)}</strong>
                </div>
                <div class="tool-hero-panel tool-hero-panel-gold">
                  <span class="tool-hero-label">Loyer mensuel viager</span>
                  <strong class="tool-hero-amount value-update">${moneyMarkup(loyerMensuelFin)}<small class="tool-hero-currency">/mois<span class="tool-hero-lifetime">—&nbsp;à vie</span></small></strong>
                </div>
              </div>
              <div class="scpi-flow-grid">
              ${showInitialPayment && immediateFlow ? `
              <div class="scpi-flow is-open${animateInitialPayment ? " is-contribution-entering" : ""}" data-flow="immediate" aria-label="Mécanique du versement initial : capital versé aujourd'hui, loyer généré dès le premier mois">
                <div class="scpi-flow-step scpi-flow-effort">
                  <span class="scpi-flow-label">Versement initial</span>
                  <strong class="scpi-flow-amount value-update">${moneyMarkup(values.versementInitial)}</strong>
                </div>
                <div class="scpi-flow-reveal" id="scpi-reveal-immediate">
                  <div class="scpi-flow-step scpi-flow-revenu">
                    <span class="scpi-flow-label">Loyer perçu immédiatement</span>
                    ${flowAmountMarkup(immediateFlow)}
                  </div>
                </div>
              </div>
              ` : ""}
              ${showScheduledPayment && viagerFlow ? `
              <div class="scpi-flow is-open${animateScheduledPayment ? " is-contribution-entering" : ""}" data-flow="viager" aria-label="Mécanique du versement programmé : effort mensuel pendant la phase d'épargne, loyer viager ensuite">
                <div class="scpi-flow-step scpi-flow-effort">
                  <span class="scpi-flow-label">Versement programmé</span>
                  <strong class="scpi-flow-amount value-update">${moneyMarkup(effortMensuel)}<small class="scpi-flow-period">/mois</small></strong>
                  <span class="scpi-flow-duration">pendant ${values.dureeVersements} ans</span>
                </div>
                <div class="scpi-flow-reveal" id="scpi-reveal-viager">
                  <div class="scpi-flow-step scpi-flow-revenu">
                    <span class="scpi-flow-label">Loyer perçu<br>à terme</span>
                    ${flowAmountMarkup(viagerFlow)}
                  </div>
                </div>
              </div>
              ` : ""}
              </div>
              <div class="scpi-summary-row">
                <div class="capital-shares">
                  <span><small>Total des loyers perçus</small><strong class="value-update">${moneyMarkup(totalLoyers)}</strong></span>
                </div>
                <div class="capital-insight">
                  <p>
                    Ce loyer de <strong class="scpi-insight-income">${moneyMarkup(loyerMensuelFin)}<small class="scpi-flow-period">/mois</small></strong> continue à vie, sans nouvel effort de votre part, tant que vous détenez vos parts.
                  </p>
                </div>
              </div>
            </article>
          `;

          [
            { active: animateInitialPayment, reveal: initialReveal, flow: "immediate", value: immediateFlow?.value },
            { active: animateScheduledPayment, reveal: scheduledReveal, flow: "viager", value: viagerFlow?.value }
          ].forEach(({ active, reveal, flow, value }) => {
            if (!active) return;
            reveal.animateNext = false;
            const amount = summary.querySelector(`[data-flow="${flow}"] .scpi-flow-revenu .scpi-money-value`);
            if (amount) {
              amount.dataset.value = "0";
              amount._displayValue = 0;
              amount.textContent = formatNumber(0);
              const startAmountReveal = () => {
                if (!amount.isConnected) return;
                animateFormattedNumber(amount, value, formatNumber, 720);
              };
              if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                startAmountReveal();
              } else {
                window.setTimeout(startAmountReveal, 520);
              }
            }
          });

          return;
        }
      }

      // Le graphique ne compare plus "versé" et "loyers perçus" (une course qui semble
      // perdue tant que le point de bascule n'est pas atteint) : il montre uniquement la
      // progression du loyer mensuel lui-même, avec des jalons chiffrés à quelques années
      // clés. Le total versé reste visible en contexte, mais en retrait.
      function renderRentGrowthChart(rows) {
        const chart = document.querySelector("#chart");
        window.clearTimeout(chart._focusTimer);
        if (!rows.length) {
          chart.dataset.initialized = "false";
          chart.innerHTML = `
            <div class="chart-zero-state" role="status">
              <span>Déplacez un curseur pour afficher la projection.</span>
            </div>
          `;
          return;
        }
        const width = 960;
        const height = 400;
        const pad = { top: 64, right: 36, bottom: 54, left: 128 };
        const values = state.values.scpi;

        const rentSeries = rows.map((row) => row.revenuMensuel || 0);
        const previousSeries = Array.isArray(chart._rentSeries) && chart._rentSeries.length === rentSeries.length
          ? chart._rentSeries
          : null;
        const scenarioChanged = previousSeries !== null && chart._reinvested !== values.reinvestir;
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const animateScenario = scenarioChanged && !reducedMotion;
        const lastYear = rows.length;
        const hasIncomePhase = values.dureeVersements < lastYear;

        // Un jalon tous les 10 ans d'investissement, jusqu'à l'année où les versements
        // s'arrêtent : au-delà, le loyer ne bouge plus (il devient viager), donc la
        // série de jalons s'arrête là plutôt que de continuer à afficher des décennies
        // qui répéteraient le même montant. Ce jalon final devient le loyer viager.
        const viagerYear = values.dureeVersements >= 1 && values.dureeVersements < rows.length
          ? values.dureeVersements
          : null;
        const finalMilestoneYear = viagerYear !== null ? viagerYear : lastYear;

        const candidateYears = new Set();
        for (let annee = 10; annee <= finalMilestoneYear; annee += 10) candidateYears.add(annee);
        candidateYears.add(finalMilestoneYear);
        const milestoneYears = Array.from(candidateYears).sort((a, b) => a - b);

        const currentMax = Math.max(...rentSeries, 1);
        const scaleMax = currentMax * 1.08;
        const previousScaleMax = Number(chart._scaleMax) || scaleMax;
        const animateBars = chart.dataset.initialized !== "true" && !animateScenario;
        const plotWidth = width - pad.left - pad.right;
        const x = (index) => pad.left + (index / Math.max(rows.length - 1, 1)) * (width - pad.left - pad.right);
        const y = (value) => height - pad.bottom - (value / scaleMax) * (height - pad.top - pad.bottom);
        const baseline = height - pad.bottom;

        // Barres plutôt que courbe lissée : effet "relevé de compte qui grossit chaque
        // année", plus parlant qu'une simple diagonale. Les jalons se détachent en couleur
        // pleine (le dernier en encre) sur le fond dégradé des barres courantes.
        const barSlot = plotWidth / Math.max(rows.length, 1);
        const barWidth = Math.max(2, barSlot * 0.62);
        const barRadius = Math.min(4, barWidth / 2);
        const bars = rentSeries.map((value, index) => {
          const annee = index + 1;
          const topY = y(value);
          const barHeight = Math.max(0, baseline - topY);
          const phaseClass = annee <= values.dureeVersements ? "chart-bar-investment" : "chart-bar-income";
          const classes = ["chart-bar", phaseClass];
          if (animateBars) classes.push("chart-bar-enter");
          if (milestoneYears.includes(annee)) classes.push("chart-bar-milestone");
          if (annee === finalMilestoneYear) classes.push("chart-bar-final");
          const animationStyle = animateBars ? ` style="--bar-delay: ${index * 9}ms"` : "";
          const previousValue = previousSeries?.[index] || 0;
          const previousY = height - pad.bottom - (previousValue / previousScaleMax) * (height - pad.top - pad.bottom);
          const previousHeight = Math.max(0, baseline - previousY);
          const scenarioAnimation = animateScenario ? `
            <animate attributeName="y" from="${previousY.toFixed(2)}" to="${topY.toFixed(2)}" dur="920ms" calcMode="spline" keySplines="0.22 1 0.36 1" fill="freeze"></animate>
            <animate attributeName="height" from="${previousHeight.toFixed(2)}" to="${barHeight.toFixed(2)}" dur="920ms" calcMode="spline" keySplines="0.22 1 0.36 1" fill="freeze"></animate>
          ` : "";
          return `<rect class="${classes.join(" ")}"${animationStyle} x="${(x(index) - barWidth / 2).toFixed(2)}" y="${topY.toFixed(2)}" width="${barWidth.toFixed(2)}" height="${barHeight.toFixed(2)}" rx="${barRadius.toFixed(2)}">${scenarioAnimation}</rect>`;
        }).join("");

        const grid = niceValueTicks(scaleMax, 4).map((value) => {
          const lineY = y(value);
          return `
            <g>
              <line x1="${pad.left}" y1="${lineY}" x2="${width - pad.right}" y2="${lineY}" />
              <text x="${pad.left - 16}" y="${lineY + 5}">${formatMoney(value)}</text>
            </g>
          `;
        }).join("");
        const ticks = niceYearTicks(rows.length).map((annee) => {
          const tickX = x(annee - 1);
          return `<text x="${tickX}" y="${height - 10}">${annee}</text>`;
        }).join("");

        // Jalons affichés en cartouches sous le graphique plutôt qu'en texte flottant
        // sur les barres : lisible à toutes les tailles, sans risque de chevauchement.
        const milestoneChips = milestoneYears.map((annee) => {
          const value = rentSeries[annee - 1];
          const isFinal = annee === finalMilestoneYear;
          const label = annee === viagerYear ? `Année ${annee} · Loyer viager` : `Année ${annee}`;
          return `
            <div class="chart-milestone-chip${isFinal ? " chart-milestone-chip-final" : ""}">
              <span>${label}</span>
              <strong><b class="chart-milestone-value" data-value="${value}">${formatMoney(value)}</b><small>/mois</small></strong>
            </div>
          `;
        }).join("");

        chart.innerHTML = `
          <div class="chart-milestone-strip" style="grid-template-columns: repeat(${milestoneYears.length}, 1fr)">${milestoneChips}</div>
          <div class="chart-canvas">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Évolution du loyer mensuel perçu au fil des années">
              <defs>
                <linearGradient id="chartAreaGains" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ad8143" stop-opacity="0.98"></stop>
                  <stop offset="52%" stop-color="#c29a60" stop-opacity="0.9"></stop>
                  <stop offset="100%" stop-color="#6f879d" stop-opacity="0.68"></stop>
                </linearGradient>
                <linearGradient id="chartAreaIncome" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#a97836" stop-opacity="0.98"></stop>
                  <stop offset="55%" stop-color="#caa466" stop-opacity="0.9"></stop>
                  <stop offset="100%" stop-color="#e5cfaa" stop-opacity="0.72"></stop>
                </linearGradient>
              </defs>
              <g class="chart-grid${animateScenario ? " chart-grid-scenario-shift" : ""}">${grid}</g>
              <g class="chart-bars">${bars}</g>
              <g class="chart-axis">${ticks}</g>
              <g class="chart-hover">
                <line class="chart-hover-line" x1="0" y1="${pad.top}" x2="0" y2="${height - pad.bottom}"></line>
                <circle class="chart-hover-dot chart-hover-dot-gains" r="4"></circle>
              </g>
            </svg>
            <div class="chart-tooltip">
              <span class="chart-tooltip-year"></span>
              <div class="chart-tooltip-row chart-tooltip-gains"><small>Loyer</small><strong></strong></div>
            </div>
          </div>
          <div class="chart-legend">
            <span><i class="legend-investment-phase"></i>Phase d’investissement</span>
            ${hasIncomePhase ? '<span><i class="legend-income-phase"></i>Phase de rente</span>' : ""}
          </div>
        `;

        chart.dataset.initialized = "true";
        chart._rentSeries = [...rentSeries];
        chart._reinvested = values.reinvestir;
        chart._scaleMax = scaleMax;
        setupRentGrowthHover(chart, rows, { x, y, pad, width, height, rentSeries, hoverScaleY: 1.05 });

        if (animateScenario) {
          const milestoneChips = chart.querySelectorAll(".chart-milestone-chip");
          milestoneYears.forEach((annee, index) => {
            const amount = milestoneChips[index]?.querySelector(".chart-milestone-value");
            if (!amount) return;
            const previousValue = previousSeries[annee - 1] || 0;
            const targetValue = rentSeries[annee - 1] || 0;
            amount._displayValue = previousValue;
            amount.dataset.value = previousValue;
            amount.textContent = formatMoney(previousValue);
            requestAnimationFrame(() => animateFormattedNumber(amount, targetValue, formatMoney, 920));
          });

          const finalChip = milestoneChips[milestoneChips.length - 1];
          if ((rentSeries.at(-1) || 0) > (previousSeries.at(-1) || 0)) {
            finalChip?.classList.add("is-value-rising");
          }
        }
      }

      function setupRentGrowthHover(chart, rows, ctx) {
        const svg = chart.querySelector("svg");
        const canvas = chart.querySelector(".chart-canvas");
        const hoverGroup = chart.querySelector(".chart-hover");
        const hoverLine = chart.querySelector(".chart-hover-line");
        const hoverDot = chart.querySelector(".chart-hover-dot-gains");
        const tooltip = chart.querySelector(".chart-tooltip");
        const tooltipYear = chart.querySelector(".chart-tooltip-year");
        const tooltipRent = chart.querySelector(".chart-tooltip-gains strong");
        const barElements = chart.querySelectorAll(".chart-bar");
        let activeBar = null;
        if (!svg || !rows.length) return;

        hoverGroup.style.display = "none";
        tooltip.hidden = true;

        const updateAt = (clientX, clientY) => {
          const point = svg.createSVGPoint();
          point.x = clientX;
          point.y = clientY;
          const ctm = svg.getScreenCTM();
          if (!ctm) return;
          const local = point.matrixTransform(ctm.inverse());
          const ratio = (local.x - ctx.pad.left) / (ctx.width - ctx.pad.left - ctx.pad.right);
          const index = Math.max(0, Math.min(rows.length - 1, Math.round(ratio * (rows.length - 1))));
          const row = rows[index];
          const px = ctx.x(index);
          const py = ctx.y(ctx.rentSeries[index]);
          const baseline = ctx.height - ctx.pad.bottom;
          const visualPy = baseline - (baseline - py) * ctx.hoverScaleY;

          if (activeBar !== barElements[index]) {
            activeBar?.classList.remove("is-hovered");
            activeBar = barElements[index];
            activeBar?.classList.add("is-hovered");
          }

          hoverGroup.style.display = "";
          hoverLine.setAttribute("x1", px);
          hoverLine.setAttribute("x2", px);
          hoverLine.setAttribute("y1", visualPy);
          hoverDot.setAttribute("cx", px);
          hoverDot.setAttribute("cy", visualPy);

          tooltipYear.textContent = `Année ${row.annee}`;
          tooltipRent.textContent = `${formatMoney(ctx.rentSeries[index])}/mois`;

          const screenPoint = svg.createSVGPoint();
          screenPoint.x = px;
          // L'infobulle suit précisément le sommet visuel de la barre afin de
          // conserver un écart court et constant avec la ligne de repère.
          screenPoint.y = visualPy;
          const screenPos = screenPoint.matrixTransform(ctm);
          const canvasRect = canvas.getBoundingClientRect();
          tooltip.hidden = false;
          tooltip.style.left = `${screenPos.x - canvasRect.left}px`;
          tooltip.style.top = `${screenPos.y - canvasRect.top}px`;
        };

        const hide = () => {
          activeBar?.classList.remove("is-hovered");
          activeBar = null;
          hoverGroup.style.display = "none";
          tooltip.hidden = true;
        };

        svg.addEventListener("mousemove", (event) => updateAt(event.clientX, event.clientY));
        svg.addEventListener("mouseleave", hide);
        svg.addEventListener("touchmove", (event) => {
          const touch = event.touches[0];
          if (touch) updateAt(touch.clientX, touch.clientY);
        }, { passive: true });
        svg.addEventListener("touchend", hide);
      }

      function renderChart(rows) {
        if (state.mode === "scpi") {
          renderRentGrowthChart(rows);
          return;
        }
        const metric = "interetsCumules";
        const metricLabel = "Intérêts gagnés";
        const investedSeries = rows.map((row) => Math.max(0, row.versementsCumules || 0));
        const capitalSeries = rows.map((row, i) => Math.max(investedSeries[i], row.capital || 0));
        const zeroSeries = rows.map(() => 0);
        renderLineChart(rows, {
          series: [
            { role: "invested", label: "Sommes investies", values: investedSeries },
            { role: "capital", label: "Capital final", values: capitalSeries }
          ],
          areas: [
            { role: "invested", lower: zeroSeries, upper: investedSeries },
            { role: "gains", lower: investedSeries, upper: capitalSeries }
          ],
          tooltipExtras: [
            { role: "gains", label: metricLabel, key: metric }
          ],
          legend: [
            { role: "capital", label: "Capital final" },
            { role: "gains", label: metricLabel },
            { role: "invested", label: "Sommes investies" }
          ],
          totals: [
            { label: "Capital final", value: rows.at(-1)?.capital },
            { label: "Sommes investies", value: rows.at(-1)?.versementsCumules, className: "capital-metric-invested" },
            { label: metricLabel, value: rows.at(-1)?.[metric], className: "capital-metric-interest" }
          ],
          ariaLabel: "Evolution annuelle du capital, des intérêts et des sommes investies"
        });
      }

      const SCPI_TABLE_YEARS = [1, 2, 3, 4, 5, 10, 15, 20, 30, 40, 50, 60, 70, 80];

      const TMI_BRACKETS = [0, 11, 30, 41, 45];

      function computeFiscalImpact(revenuAnnuelBrut, tmi) {
        const irAmount = revenuAnnuelBrut * (tmi / 100);
        const psAmount = revenuAnnuelBrut * (PS_RATE / 100);
        return {
          francaise: {
            irShare: tmi,
            psShare: PS_RATE,
            irAmount,
            psAmount,
            totalRate: tmi + PS_RATE,
            net: revenuAnnuelBrut - irAmount - psAmount
          },
          etrangere: {
            irShare: tmi,
            psShare: 0,
            irAmount,
            psAmount: 0,
            totalRate: tmi,
            net: revenuAnnuelBrut - irAmount
          }
        };
      }

      function fiscalDonut(irShare, psShare, label) {
        const size = 176;
        const strokeWidth = 22;
        const radius = (size - strokeWidth) / 2;
        const circumference = 2 * Math.PI * radius;
        const gap = 5;
        let cursor = 0;
        const parts = [
          { share: irShare, className: "fiscal-donut-ir" },
          { share: psShare, className: "fiscal-donut-ps" }
        ];
        const circles = parts.map((part) => {
          if (part.share <= 0) return "";
          const full = (part.share / 100) * circumference;
          const hasGap = part.share < 100;
          const drawn = Math.max(0, full - (hasGap ? gap : 0));
          const offset = cursor + (hasGap ? gap / 2 : 0);
          cursor += full;
          return `<circle class="fiscal-donut-segment ${part.className}" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}" stroke-dasharray="${drawn} ${circumference - drawn}" stroke-dashoffset="${-offset}"></circle>`;
        }).join("");
        return `
          <svg viewBox="0 0 ${size} ${size}" class="fiscal-donut" role="img" aria-label="${label}">
            <circle class="fiscal-donut-track" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}"></circle>
            ${circles}
          </svg>
        `;
      }

      function fiscalCard(title, data, hasPS) {
        return `
          <div class="fiscal-card${hasPS ? "" : " fiscal-card-foreign"}">
            <h3>${title}</h3>
            <div class="fiscal-donut-wrap">
              ${fiscalDonut(data.irShare, data.psShare, `Taux d'imposition : ${formatPercent(data.totalRate)} %`)}
              <div class="fiscal-donut-center">
                <strong>${formatPercent(data.totalRate)} %</strong>
                <span>imposition</span>
              </div>
            </div>
            <ul class="fiscal-breakdown">
              <li class="fiscal-line-ir"><span>Impôt sur le revenu (${formatPercent(data.irShare)} %)</span><strong>${formatMoney(data.irAmount)}</strong></li>
              <li class="fiscal-line-ps${hasPS ? "" : " fiscal-line-void"}"><span>Prélèvements sociaux${hasPS ? ` (${formatPercent(PS_RATE)} %)` : ""}</span><strong>${hasPS ? formatMoney(data.psAmount) : "Supprimés"}</strong></li>
              <li class="fiscal-line-net"><span>Loyer net</span><strong>${formatMoney(data.net)}</strong></li>
            </ul>
          </div>
        `;
      }

      function renderFiscal(rows) {
        const panel = document.querySelector("#fiscal");
        const values = state.values.scpi;
        const last = rows.at(-1) || {};
        const revenuAnnuelBrut = last.revenuAnnuel || 0;
        const impact = computeFiscalImpact(revenuAnnuelBrut, values.tmi);
        const gainAnnuel = impact.francaise.psAmount;

        panel.innerHTML = `
          <p class="fiscal-intro">
            Illustration sur le loyer annuel brut de l'année ${rows.length} (${formatMoney(revenuAnnuelBrut)}), selon votre tranche marginale d'imposition.
          </p>
          <div class="fiscal-tmi">
            <span>Tranche marginale d'imposition (TMI)</span>
            <div class="tool-presets">
              ${TMI_BRACKETS.map((t) => `<button type="button" class="tool-preset${values.tmi === t ? " is-active" : ""}" data-tmi="${t}">${t} %</button>`).join("")}
            </div>
          </div>
          <div class="fiscal-compare">
            ${fiscalCard("SCPI françaises", impact.francaise, true)}
            ${fiscalCard("SCPI européennes / étrangères", impact.etrangere, false)}
          </div>
          <div class="fiscal-gain">
            <p>
              En optant pour des SCPI de sources étrangères (zone européenne, via convention fiscale), vous économiseriez environ
              <strong>${formatMoney(gainAnnuel)}</strong> par an de prélèvements sociaux sur ce loyer, soit
              <strong>${formatMoney(gainAnnuel / 12)}</strong> de plus par mois dans votre poche, à rendement égal.
            </p>
          </div>
          <p class="fiscal-disclaimer">
            Simplification illustrative du mécanisme du taux effectif applicable à certaines SCPI investies hors de France
            (Allemagne, Pays-Bas, Espagne…) : selon la convention fiscale applicable, les prélèvements sociaux ne s'appliquent
            pas aux revenus fonciers de source étrangère, seul l'impôt sur le revenu reste dû. Cette estimation ne remplace
            pas une étude fiscale personnalisée.
          </p>
        `;

        panel.querySelectorAll(".tool-preset").forEach((button) => {
          button.addEventListener("click", () => {
            values.tmi = Number(button.dataset.tmi);
            renderFiscal(rows);
          });
        });
      }

      function setupCompareHover(chart, avRows, ctx) {
        const svg = chart.querySelector("svg");
        const canvas = chart.querySelector(".chart-canvas");
        const hoverGroup = chart.querySelector(".chart-hover");
        const hoverLine = chart.querySelector(".chart-hover-line");
        const hoverDotAv = chart.querySelector(".chart-hover-dot-capital");
        const hoverDotLivret = chart.querySelector(".chart-hover-dot-invested");
        const tooltip = chart.querySelector(".chart-tooltip");
        const tooltipYear = chart.querySelector(".chart-tooltip-year");
        const tooltipAv = chart.querySelector(".chart-tooltip-capital strong");
        const tooltipLivret = chart.querySelector(".chart-tooltip-invested strong");
        if (!svg || !avRows.length) return;

        hoverGroup.style.display = "none";
        tooltip.hidden = true;

        const updateAt = (clientX, clientY) => {
          const point = svg.createSVGPoint();
          point.x = clientX;
          point.y = clientY;
          const ctm = svg.getScreenCTM();
          if (!ctm) return;
          const local = point.matrixTransform(ctm.inverse());
          const ratio = (local.x - ctx.pad.left) / (ctx.width - ctx.pad.left - ctx.pad.right);
          const index = Math.max(0, Math.min(avRows.length - 1, Math.round(ratio * (avRows.length - 1))));
          const row = avRows[index];
          const px = ctx.x(index);
          const avY = ctx.y(ctx.avSeries[index]);
          const livretY = ctx.y(ctx.livretSeries[index]);

          hoverGroup.style.display = "";
          hoverLine.setAttribute("x1", px);
          hoverLine.setAttribute("x2", px);
          hoverDotAv.setAttribute("cx", px);
          hoverDotAv.setAttribute("cy", avY);
          hoverDotLivret.setAttribute("cx", px);
          hoverDotLivret.setAttribute("cy", livretY);

          tooltipYear.textContent = `Année ${row.annee}`;
          tooltipAv.textContent = formatMoney(roundToHundred(ctx.avSeries[index]));
          tooltipLivret.textContent = formatMoney(roundToHundred(ctx.livretSeries[index]));

          const screenPoint = svg.createSVGPoint();
          screenPoint.x = px;
          screenPoint.y = Math.min(avY, livretY);
          const screenPos = screenPoint.matrixTransform(ctm);
          const canvasRect = canvas.getBoundingClientRect();
          tooltip.hidden = false;
          tooltip.style.left = `${screenPos.x - canvasRect.left}px`;
          tooltip.style.top = `${screenPos.y - canvasRect.top}px`;
        };

        const hide = () => {
          hoverGroup.style.display = "none";
          tooltip.hidden = true;
        };

        svg.addEventListener("mousemove", (event) => updateAt(event.clientX, event.clientY));
        svg.addEventListener("mouseleave", hide);
        svg.addEventListener("touchmove", (event) => {
          const touch = event.touches[0];
          if (touch) updateAt(touch.clientX, touch.clientY);
        }, { passive: true });
        svg.addEventListener("touchend", hide);
      }

      function animateValue(el, from, to, duration = 700) {
        const token = (el._animateToken = (el._animateToken || 0) + 1);
        const start = performance.now();
        const step = (now) => {
          if (el._animateToken !== token) return;
          const progress = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          el.textContent = formatMoney(from + (to - from) * eased).replace(/\s?€$/, "");
          if (progress < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      function renderCompareSubtabs() {
        return `
          <div class="tool-presets">
            <button type="button" class="tool-preset${state.compareView === "ecart" ? " is-active" : ""}" data-subview="ecart">Manque à gagner</button>
            <button type="button" class="tool-preset${state.compareView === "evolution" ? " is-active" : ""}" data-subview="evolution">Évolution dans le temps</button>
          </div>
        `;
      }

      function renderLivretRateControl(values) {
        const min = 0;
        const max = 5;
        const progress = ((values.tauxLivretA - min) / (max - min)) * 100;
        return `
          <div class="livret-rate-control">
            <div class="livret-rate-heading">
              <span>Taux net du Livret bancaire retenu</span>
              <strong><span data-livret-rate-value>${formatPercent(values.tauxLivretA)}</span><small>&nbsp;%</small></strong>
            </div>
            <input
              class="livret-rate-range"
              type="range"
              min="${min}"
              max="${max}"
              step="0.1"
              value="${values.tauxLivretA}"
              style="--range-progress:${Math.max(0, Math.min(100, progress))}%"
              aria-label="Taux net du Livret bancaire retenu"
              aria-valuetext="${formatPercent(values.tauxLivretA)} %"
              data-livret-rate
            >
          </div>
        `;
      }

      function renderCompareDisclaimer() {
        return `
          <p class="fiscal-disclaimer">
            Comparaison brute avant fiscalité de sortie, au taux net de votre choix. Si vous retenez le taux réel du Livret A, rappel : versements plafonnés à 22 950 € par personne (les intérêts déjà acquis continuent au-delà).
          </p>
        `;
      }

      function renderCompareShock(chart, avSeries, livretSeries, values) {
        const avFinal = avSeries.at(-1) || 0;
        const livretFinal = livretSeries.at(-1) || 0;
        const ecart = Math.max(0, avFinal - livretFinal);
        const livretShare = avFinal > 0 ? Math.max(0, Math.min(100, (livretFinal / avFinal) * 100)) : 0;
        const previous = state.previousGauge.compare || { ecart: 0, livretShare: 0 };

        chart.innerHTML = `
          ${renderCompareSubtabs()}
          <div class="capital-heading">
            <div>
              <strong class="capital-amount value-update"><span class="compare-shock-value">${formatMoney(previous.ecart).replace(/\s?€$/, "")}</span><span class="capital-currency">€</span></strong>
            </div>
          </div>
          <div class="compare-race" aria-label="Comparaison des capitaux finaux entre Livret bancaire et assurance vie">
            <div class="compare-race-row">
              <div class="compare-race-head">
                <span>Livret bancaire <small>${values.tauxLivretA} % net</small></span>
                <strong>${formatMoney(livretFinal)}</strong>
              </div>
              <div class="compare-race-track"><span class="compare-race-bar compare-race-bar-livret" style="width:${previous.livretShare}%"></span></div>
            </div>
            <div class="compare-race-row">
              <div class="compare-race-head">
                <span>Assurance Vie <small>${values.rendement} %</small></span>
                <strong>${formatMoney(avFinal)}</strong>
              </div>
              <div class="compare-race-track"><span class="compare-race-bar compare-race-bar-av" style="width:100%"></span></div>
            </div>
          </div>
          <p class="capital-insight">
            En plaçant ${formatMoney(values.capitalInitial)} aujourd'hui puis ${formatMoney(values.versementMensuel)} chaque mois pendant ${formatNumber(values.dureeTotale)} ans,
            un Livret bancaire à ${formatPercent(values.tauxLivretA)}&nbsp;% plafonnerait à ${formatMoney(livretFinal)}, contre ${formatMoney(avFinal)} pour l'assurance vie à
            ${formatPercent(values.rendement)}&nbsp;% : c'est ${formatMoney(ecart)} que le client laisse sur la table en restant sur un placement sans risque.
          </p>
          ${renderLivretRateControl(values)}
          ${renderCompareDisclaimer()}
        `;

        state.previousGauge.compare = { ecart, livretShare };
        requestAnimationFrame(() => {
          const bar = chart.querySelector(".compare-race-bar-livret");
          if (bar) bar.style.width = `${livretShare}%`;
          const valueEl = chart.querySelector(".compare-shock-value");
          if (valueEl) animateValue(valueEl, previous.ecart, ecart);
        });
      }

      function renderCompareEvolution(chart, avRows, avSeries, livretSeries, values) {
        const width = 960;
        const height = 380;
        const pad = { top: 28, right: 36, bottom: 54, left: 128 };
        const avAdjusted = avSeries.map((value, i) => Math.max(value, livretSeries[i]));
        const max = Math.max(...avSeries, ...livretSeries, 1);

        const x = (index) => pad.left + (index / Math.max(avRows.length - 1, 1)) * (width - pad.left - pad.right);
        const y = (value) => height - pad.bottom - (value / max) * (height - pad.top - pad.bottom);
        const pointsFor = (series) => series.map((value, index) => `${x(index)},${y(value)}`).join(" ");
        const areaPath = (lowerSeries, upperSeries) => {
          const top = upperSeries.map((value, index) => `${x(index)},${y(value)}`);
          const bottom = lowerSeries.map((value, index) => `${x(index)},${y(value)}`).reverse();
          return `M${top.join(" L")} L${bottom.join(" L")} Z`;
        };
        const zeroSeries = avRows.map(() => 0);

        const grid = niceValueTicks(max, 4).map((value) => {
          const lineY = y(value);
          return `
            <g>
              <line x1="${pad.left}" y1="${lineY}" x2="${width - pad.right}" y2="${lineY}" />
              <text x="${pad.left - 16}" y="${lineY + 5}">${formatMoney(value)}</text>
            </g>
          `;
        }).join("");
        const ticks = niceYearTicks(avRows.length).map((annee) => {
          const tickX = x(annee - 1);
          return `<text x="${tickX}" y="${height - 10}">${annee}</text>`;
        }).join("");

        const avFinal = avSeries.at(-1) || 0;
        const livretFinal = livretSeries.at(-1) || 0;
        const ecart = Math.max(0, avFinal - livretFinal);

        chart.innerHTML = `
          ${renderCompareSubtabs()}
          <div class="chart-totals">
            <span class="capital-metric-invested">Livret bancaire <strong>${formatMoney(livretFinal)}</strong></span>
            <span class="capital-metric-interest">Assurance Vie <strong>${formatMoney(avFinal)}</strong></span>
            <span>Manque à gagner <strong>${formatMoney(ecart)}</strong></span>
          </div>
          <div class="chart-canvas">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Comparaison entre un Livret bancaire et votre assurance vie">
              <defs>
                <linearGradient id="chartAreaInvested" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#6f8ba7" stop-opacity="0.5"></stop>
                  <stop offset="100%" stop-color="#6f8ba7" stop-opacity="0.05"></stop>
                </linearGradient>
                <linearGradient id="chartAreaGains" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#b99761" stop-opacity="0.55"></stop>
                  <stop offset="100%" stop-color="#b99761" stop-opacity="0.08"></stop>
                </linearGradient>
              </defs>
              <g class="chart-grid">${grid}</g>
              <path class="chart-area chart-area-invested" d="${areaPath(zeroSeries, livretSeries)}"></path>
              <path class="chart-area chart-area-gains" d="${areaPath(livretSeries, avAdjusted)}"></path>
              <polyline class="chart-line chart-line-invested" points="${pointsFor(livretSeries)}"></polyline>
              <polyline class="chart-line chart-line-capital" points="${pointsFor(avSeries)}"></polyline>
              <g class="chart-axis">${ticks}</g>
              <g class="chart-hover">
                <line class="chart-hover-line" x1="0" y1="${pad.top}" x2="0" y2="${height - pad.bottom}"></line>
                <circle class="chart-hover-dot chart-hover-dot-capital" r="4"></circle>
                <circle class="chart-hover-dot chart-hover-dot-invested" r="4"></circle>
              </g>
            </svg>
            <div class="chart-tooltip">
              <span class="chart-tooltip-year"></span>
              <div class="chart-tooltip-row chart-tooltip-capital"><small>Assurance Vie</small><strong></strong></div>
              <div class="chart-tooltip-row chart-tooltip-invested"><small>Livret bancaire</small><strong></strong></div>
            </div>
          </div>
          <div class="chart-legend">
            <span><i class="legend-invested"></i>Livret bancaire</span>
            <span><i class="legend-capital"></i>Assurance Vie</span>
          </div>
          ${renderLivretRateControl(values)}
          ${renderCompareDisclaimer()}
        `;

        setupCompareHover(chart, avRows, { x, y, pad, width, avSeries, livretSeries });
      }

      function renderCompare(avRows) {
        const chart = document.querySelector("#compare");
        const values = state.values.av;
        const livretRows = computeLivretA(values);
        const avSeries = avRows.map((row) => row.capital || 0);
        const livretSeries = livretRows.map((row) => row.capital || 0);

        if (!avRows.length) {
          chart.innerHTML = `
            ${renderCompareSubtabs()}
            <div class="chart-zero-state" role="status">
              <span>Déplacez un curseur pour afficher la comparaison.</span>
            </div>
            ${renderLivretRateControl(values)}
            ${renderCompareDisclaimer()}
          `;
        } else if (state.compareView === "evolution") {
          renderCompareEvolution(chart, avRows, avSeries, livretSeries, values);
        } else {
          renderCompareShock(chart, avSeries, livretSeries, values);
        }

        chart.querySelectorAll("[data-subview]").forEach((button) => {
          button.addEventListener("click", () => {
            state.compareView = button.dataset.subview;
            renderCompare(avRows);
          });
        });
        const rateRange = chart.querySelector("[data-livret-rate]");
        if (rateRange) {
          rateRange.addEventListener("input", () => {
            values.tauxLivretA = Number(rateRange.value);
            const progress = (values.tauxLivretA / Number(rateRange.max || 5)) * 100;
            const value = chart.querySelector("[data-livret-rate-value]");
            rateRange.style.setProperty("--range-progress", `${Math.max(0, Math.min(100, progress))}%`);
            rateRange.setAttribute("aria-valuetext", `${formatPercent(values.tauxLivretA)} %`);
            if (value) value.textContent = formatPercent(values.tauxLivretA);
          });
          rateRange.addEventListener("change", () => renderCompare(avRows));
        }
      }

      function renderOutputs() {
        const rows = rowsForMode();
        const content = modeContent[state.mode];
        const chartReinvestControl = document.querySelector("#scpi-chart-reinvest");
        document.title = `${content.title} | Simulateur`;
        document.querySelector("#tool-page-title").textContent = content.title;
        document.querySelector(".tool-card-title h2").textContent = content.chartTitle;
        chartReinvestControl.hidden = state.mode !== "scpi";
        if (state.mode === "scpi") {
          const reinvestir = state.values.scpi.reinvestir;
          chartReinvestControl.classList.toggle("is-active", reinvestir);
          chartReinvestControl.setAttribute("aria-pressed", String(reinvestir));
          chartReinvestControl.setAttribute("aria-label", reinvestir ? "Désactiver le réinvestissement des loyers" : "Activer le réinvestissement des loyers");
          chartReinvestControl.querySelector("strong").textContent = reinvestir ? "Loyers réinvestis" : "Loyers non réinvestis";
        }
        if (state.mode === "av") {
          document.querySelector("#compare-panel .tool-card-title h2").textContent = `Livret bancaire vs Assurance Vie : manque à gagner sur ${formatNumber(state.values.av.dureeTotale)} ans`;
        }
        renderSummary(rows);
        renderChart(rows);
        renderPie(rows, {
          metric: state.mode === "scpi" ? "revenusCumules" : "interetsCumules",
          metricLabel: state.mode === "scpi" ? "Loyers cumulés" : "Intérêts gagnés"
        });

        let tableHeaders;
        let tableMapper;
        let tableRows = rows;
        if (state.mode === "scpi") {
          tableHeaders = ["Année", "Versements", "Loyer mensuel", "Loyer annuel", "Loyers cumulés", "Capital"];
          tableMapper = (row) => [row.annee, formatMoney(row.versementsCumules), formatMoney(row.revenuMensuel), formatMoney(row.revenuAnnuel), formatMoney(row.revenusCumules), formatMoney(row.capital)];
          const milestones = new Set(SCPI_TABLE_YEARS.filter((year) => year <= rows.length));
          if (rows.length) milestones.add(rows.length);
          tableRows = rows.filter((row) => milestones.has(row.annee));
        } else {
          tableHeaders = ["Année", "Versements", "Intérêts annuels", "Intérêts cumulés", "Capital"];
          tableMapper = (row) => [row.annee, formatMoney(row.versementsCumules), formatMoney(row.interetsAnnuels), formatMoney(row.interetsCumules), formatMoney(row.capital)];
        }
        renderTable(tableHeaders, tableMapper, tableRows);

        if (state.mode === "av") renderCompare(rows);
      }

      function render() {
        releaseScpiChartHeightLock();
        renderFields();
        renderOutputs();
      }

      document.querySelector("#zero-fields").addEventListener("click", () => {
        const values = state.values[state.mode];
        const versementFields = {
          av: ["capitalInitial", "versementMensuel"],
          scpi: ["versementInitial", "versementMensuel"]
        };
        (versementFields[state.mode] || []).forEach((key) => {
          values[key] = 0;
        });
        withHeightTransition(document.querySelector(".tool-params"), render);
      });

      document.querySelector("#reset-fields").addEventListener("click", () => {
        state.values[state.mode] = structuredClone(defaults[state.mode]);
        if (state.mode === "scpi") {
          Object.values(scpiContributionReveals).forEach((reveal) => {
            window.clearTimeout(reveal.timer);
            reveal.timer = 0;
            reveal.pending = false;
            reveal.animateNext = false;
          });
        }
        withHeightTransition(document.querySelector(".tool-params"), render);
      });

      document.querySelector("#scpi-chart-reinvest").addEventListener("click", () => {
        if (state.mode !== "scpi") return;
        updateScpiReinvestment(!state.values.scpi.reinvestir, { preserveChartPosition: true });
      });

      window.addEventListener("resize", releaseScpiChartHeightLock, { passive: true });

      if (state.mode === "av") {
        document.querySelector("#compare-view-button").hidden = false;
      }

      document.querySelectorAll(".tool-view-toggle button").forEach((button) => {
        button.addEventListener("click", () => {
          const applyView = () => {
            state.view = button.dataset.view;
            document.querySelectorAll(".tool-view-toggle button").forEach((item) => {
              item.classList.toggle("is-active", item === button);
            });
            document.querySelector("#chart-panel").hidden = state.view !== "chart";
            document.querySelector("#pie-panel").hidden = state.view !== "pie";
            document.querySelector("#table-panel").hidden = state.view !== "table";
            document.querySelector("#compare-panel").hidden = state.view !== "compare";
          };
          if (document.startViewTransition) {
            document.startViewTransition(applyView);
          } else {
            applyView();
          }
        });
      });

      render();
    </script>
  </body>
</html>
