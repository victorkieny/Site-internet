    <script>
      const formatMoney = (value) => new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR",
        maximumFractionDigits: 0
      }).format(Math.round(value || 0));

      const formatNumber = (value) => new Intl.NumberFormat("fr-FR", {
        maximumFractionDigits: 0
      }).format(Math.round(value || 0));

      const roundToHundred = (value) => Math.round((value || 0) / 100) * 100;

      const formatPercent = (value) => new Intl.NumberFormat("fr-FR", {
        maximumFractionDigits: 1
      }).format(value || 0);

      // En dessous de 10€/mois, le montant mensuel devient peu lisible : on affiche alors
      // l'équivalent annuel s'il reste significatif. Au-dessus, le revenu mensuel reste
      // toujours prioritaire afin de montrer immédiatement ce que gagne l'investisseur.
      function scpiFlowRevenu(monthly) {
        const annual = monthly * 12;
        if (monthly >= 10) return { value: monthly, unit: "/mois", annual, showAnnual: monthly < 100 };
        if (annual >= 100) return { value: annual, unit: "/an", annual, showAnnual: false };
        return null;
      }

      // Pour le versement initial uniquement : l'annuel est prioritaire sous
      // 100 €/mois, tandis que l'équivalent mensuel reste visible en dessous.
      function scpiImmediateFlowRevenu(monthly) {
        if (!Number.isFinite(monthly) || monthly <= 0) return null;
        const annual = monthly * 12;
        if (monthly < 100) {
          return { value: annual, unit: "/an", secondaryValue: monthly, secondaryPeriod: "par mois" };
        }
        return { value: monthly, unit: "/mois", secondaryValue: annual, secondaryPeriod: "par an" };
      }

      function niceStep(range, targetCount) {
        const rawStep = range / Math.max(1, targetCount);
        if (!Number.isFinite(rawStep) || rawStep <= 0) return 1;
        const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
        const residual = rawStep / magnitude;
        let niceResidual;
        if (residual < 1.5) niceResidual = 1;
        else if (residual < 3) niceResidual = 2;
        else if (residual < 7) niceResidual = 5;
        else niceResidual = 10;
        return niceResidual * magnitude;
      }

      // Round, "speakable" axis labels (100 000 / 200 000 / 300 000, année 1 / 5 / 10...)
      // rather than exact fractions of the data — the curve itself stays exact and can
      // simply run a bit past the last labeled gridline.
      function niceValueTicks(max, targetCount = 4) {
        if (!Number.isFinite(max) || max <= 0) return [];
        const step = niceStep(max, targetCount);
        const ticks = [];
        for (let value = step; value <= max + step * 0.001; value += step) {
          ticks.push(Math.round(value));
        }
        return ticks;
      }

      function niceYearTicks(totalYears) {
        if (totalYears <= 1) return [1];
        const step = niceStep(totalYears, 6);
        const ticks = new Set([1]);
        for (let value = step; value < totalYears; value += step) {
          ticks.add(Math.round(value));
        }
        ticks.add(totalYears);
        return Array.from(ticks).sort((a, b) => a - b);
      }

      const defaults = {
        scpi: {
          rendement: 5,
          versementInitial: 10000,
          versementMensuel: 300,
          dureeVersements: 30,
          dureeTotale: 50,
          reinvestir: false,
          tmi: 30
        },
        av: {
          capitalInitial: 10000,
          versementMensuel: 500,
          dureeTotale: 30,
          rendement: 3,
          frais: 0.6,
          fraisActifs: false,
          fraisEntree: 0,
          fraisEntreeActifs: false,
          tauxLivretA: 1.7
        },
        per: {
          revenuNet: 40000,
          versementPER: 4100,
          parts: 1
        }
      };

      const params = new URLSearchParams(window.location.search);
      const requestedMode = params.get("mode");
      const initialMode = ["av", "scpi", "per"].includes(requestedMode) ? requestedMode : "av";

      const state = {
        mode: initialMode,
        view: "chart",
        values: structuredClone(defaults),
        previousGauge: {},
        compareView: "ecart"
      };
      document.body.dataset.mode = state.mode;

      const modeContent = {
        av: {
          label: "Assurance Vie",
          title: "Assurance Vie",
          description: "Projection de l'encours dans le temps et visualisation des intérêts composés.",
          chartTitle: "Encours projeté"
        },
        scpi: {
          label: "SCPI",
          title: "SCPI",
          description: "Projection des loyers perçus par mois et par an, et de leur progression dans le temps.",
          chartTitle: "Évolution des loyers perçus"
        },
        per: {
          label: "PER",
          title: "PER",
          description: "Estimation de l'économie d'impôt liée à un versement déductible sur un PER.",
          chartTitle: "Impôt avant et après PER"
        }
      };

      function computeScpi(values) {
        const rows = [];
        let versementsCumules = 0;
        let capital = 0;
        let revenusCumules = 0;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = annee <= values.dureeVersements ? values.versementMensuel * 12 : 0;
          if (annee === 1) {
            versementsCumules = values.versementInitial + versementAnnuel;
            capital = versementsCumules;
          } else {
            versementsCumules += versementAnnuel;
            capital += versementAnnuel;
          }

          const revenuAnnuel = capital * (values.rendement / 100);
          const revenuMensuel = revenuAnnuel / 12;
          revenusCumules += revenuAnnuel;

          if (values.reinvestir && annee <= values.dureeVersements) {
            capital += revenuAnnuel;
            versementsCumules += revenuAnnuel;
          }

          rows.push({
            annee,
            versementsCumules,
            versementAnnuel,
            revenuMensuel,
            revenuAnnuel,
            revenusCumules,
            capital
          });
        }
        return rows;
      }

      function computeAssuranceVie(values) {
        const rows = [];
        const rendementNet = Math.max(
          0,
          values.rendement
            - (values.fraisActifs ? values.frais : 0)
        );
        const entreeNet = 1 - (values.fraisEntreeActifs ? values.fraisEntree / 100 : 0);
        let versementsCumules = 0;
        let interetsCumules = 0;
        let capital = 0;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = values.versementMensuel * 12;
          const versementAnnuelNet = versementAnnuel * entreeNet;
          if (annee === 1) {
            const capitalInitialNet = values.capitalInitial * entreeNet;
            versementsCumules = values.capitalInitial + versementAnnuel;
            const interetsAnnuels = capitalInitialNet * (rendementNet / 100);
            interetsCumules += interetsAnnuels;
            capital = capitalInitialNet + versementAnnuelNet + interetsAnnuels;
            rows.push({ annee, versementsCumules, versementAnnuel, interetsAnnuels, interetsCumules, capital });
          } else {
            versementsCumules += versementAnnuel;
            const interetsAnnuels = capital * (rendementNet / 100);
            interetsCumules += interetsAnnuels;
            capital = capital + versementAnnuelNet + interetsAnnuels;
            rows.push({ annee, versementsCumules, versementAnnuel, interetsAnnuels, interetsCumules, capital });
          }
        }
        return rows;
      }

      // Même effort d'épargne (versement initial + mensuel) que l'assurance vie,
      // mais placé sur un Livret A : sert de point de comparaison "sans risque".
      function computeLivretA(values) {
        const rows = [];
        let versementsCumules = 0;
        let capital = 0;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = values.versementMensuel * 12;
          if (annee === 1) {
            versementsCumules = values.capitalInitial + versementAnnuel;
            const interetsAnnuels = values.capitalInitial * (values.tauxLivretA / 100);
            capital = values.capitalInitial + versementAnnuel + interetsAnnuels;
            rows.push({ annee, versementsCumules, capital });
          } else {
            versementsCumules += versementAnnuel;
            const interetsAnnuels = capital * (values.tauxLivretA / 100);
            capital = capital + versementAnnuel + interetsAnnuels;
            rows.push({ annee, versementsCumules, capital });
          }
        }
        return rows;
      }

      const IR_BRACKETS_2026 = [
        { min: 0, max: 11600, rate: 0 },
        { min: 11600, max: 29580, rate: 0.11 },
        { min: 29580, max: 84578, rate: 0.30 },
        { min: 84578, max: 169156, rate: 0.41 },
        { min: 169156, max: Infinity, rate: 0.45 }
      ];

      function perAllowance(revenuNet) {
        return Math.min(Math.max(revenuNet * 0.10, 504), 14426);
      }

      function computeIncomeTax(revenuImposable, parts) {
        const quotient = revenuImposable / Math.max(0.5, parts);
        let taxPerPart = 0;
        let tmi = 0;
        for (const bracket of IR_BRACKETS_2026) {
          if (quotient <= bracket.min) break;
          taxPerPart += (Math.min(quotient, bracket.max) - bracket.min) * bracket.rate;
          tmi = bracket.rate;
        }
        return { tax: Math.round(taxPerPart * parts), tmi };
      }

      function computePerResult(values, versement = values.versementPER) {
        const allowance = perAllowance(values.revenuNet);
        const beforeIncome = Math.max(0, values.revenuNet - allowance);
        const deductible = Math.max(0, versement);
        const afterIncome = Math.max(0, beforeIncome - deductible);
        const before = computeIncomeTax(beforeIncome, values.parts);
        const after = computeIncomeTax(afterIncome, values.parts);
        return {
          versement,
          deductible,
          allowance,
          beforeIncome: Math.round(beforeIncome),
          afterIncome: Math.round(afterIncome),
          taxBefore: before.tax,
          taxAfter: after.tax,
          gain: before.tax - after.tax,
          tmiBefore: before.tmi,
          tmiAfter: after.tmi
        };
      }

      function computePer(values) {
        const candidates = [0, 1000, 2000, 3000, values.versementPER];
        return [...new Set(candidates.map((value) => Math.max(0, value)))]
          .sort((a, b) => a - b)
          .map((versement) => computePerResult(values, versement));
      }

      const fieldDefinitions = {
        scpi: [
          { key: "rendement", label: "Taux de distribution", type: "number", min: 0, max: 15, step: 0.1, suffix: "%" },
          { key: "versementInitial", label: "Versement initial", type: "number", min: 0, max: 500000, step: 1000, suffix: "€" },
          { key: "versementMensuel", label: "Versement mensuel", type: "number", min: 0, max: 5000, step: 50, suffix: "€" },
          { key: "dureeVersements", label: "Durée des versements", type: "number", min: 1, max: 50, step: 1, suffix: "ans" },
          { key: "dureeTotale", label: "Durée totale", type: "number", min: 1, max: 80, step: 1, suffix: "ans" },
          { key: "reinvestir", label: "Réinvestir les loyers", type: "checkbox", checkedNote: "Les loyers sont réinjectés dans le capital pendant la période de versement, puis vous sont versés.\nCe calcul réinvestit les loyers bruts, avant fiscalité." }
        ],
        av: [
          { key: "capitalInitial", label: "Versement initial", type: "number", min: 0, max: 500000, step: 1000, suffix: "€" },
          { key: "versementMensuel", label: "Versement mensuel", type: "number", min: 0, max: 10000, step: 50, suffix: "€" },
          { key: "rendement", label: "Rendement annuel", type: "number", min: 0, max: 15, step: 0.1, suffix: "%" },
          { key: "dureeTotale", label: "Durée totale", type: "number", min: 1, max: 60, step: 1, suffix: "ans" },
          { key: "fraisEntreeActifs", label: "Droits d'entrée", type: "checkbox" },
          { key: "fraisEntree", label: "Taux des droits d'entrée", type: "number", min: 0, max: 4.8, step: 0.1, suffix: "%", dependsOn: "fraisEntreeActifs" },
          { key: "fraisActifs", label: "Frais de gestion annuels", type: "checkbox" },
          { key: "frais", label: "Taux de frais de gestion", type: "number", min: 0, max: 3, step: 0.1, suffix: "%", dependsOn: "fraisActifs" }
        ],
        per: [
          { key: "revenuNet", label: "Revenu net annuel avant IR", type: "number", min: 0, max: 800000, step: 500, suffix: "€" },
          { key: "versementPER", label: "Versement PER annuel", type: "number", min: 0, max: 50000, step: 100, suffix: "€" },
          { key: "parts", label: "Nombre de parts fiscales", type: "select", options: [1, 1.5, 2, 2.5, 3], suffix: "part(s)" }
        ]
      };

      function rowsForMode() {
        if (state.mode === "scpi") return computeScpi(state.values.scpi);
        if (state.mode === "av") return computeAssuranceVie(state.values.av);
        return computePer(state.values.per);
      }

      function parseInputNumber(value) {
        const normalized = String(value || "")
          .replace(/\s/g, "")
          .replace(",", ".");
        return Number(normalized || 0);
      }

      function formatInputNumber(value) {
        const number = Number(value || 0);
        if (!Number.isFinite(number)) return "";
        const [integer, decimal] = String(number).split(".");
        const formattedInteger = integer.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        return decimal ? `${formattedInteger},${decimal}` : formattedInteger;
      }

      function withHeightTransition(el, mutate) {
        if (!el) {
          mutate();
          return;
        }
        const token = (el._heightTransitionToken = (el._heightTransitionToken || 0) + 1);

        // Undo any leftover inline sizing from a previous run that never
        // reached its cleanup step (e.g. interrupted mid-flight), so this
        // run always starts from the element's true natural/stretched size.
        el.style.transition = "none";
        el.style.height = "";
        el.style.overflow = "";
        const startHeight = el.getBoundingClientRect().height;

        mutate();
        const endHeight = el.getBoundingClientRect().height;

        if (Math.abs(endHeight - startHeight) < 1) return;

        el.style.overflow = "hidden";
        el.style.height = `${startHeight}px`;
        el.getBoundingClientRect();

        requestAnimationFrame(() => {
          if (el._heightTransitionToken !== token) return;
          el.style.transition = "height 320ms cubic-bezier(0.22, 1, 0.36, 1)";
          el.style.height = `${endHeight}px`;
        });

        const cleanup = () => {
          el.removeEventListener("transitionend", onEnd);
          if (el._heightTransitionToken !== token) return;
          el.style.transition = "";
          el.style.height = "";
          el.style.overflow = "";
        };
        const onEnd = (event) => {
          if (event.target !== el || event.propertyName !== "height") return;
          cleanup();
        };
        el.addEventListener("transitionend", onEnd);
        // Safety net: guarantees cleanup even if transitionend never fires
        // (e.g. the transition gets interrupted by another toggle).
        window.setTimeout(cleanup, 420);
      }

      function renderFields() {
        const fields = document.querySelector("#fields");
        const values = state.values[state.mode];
        const fieldRefreshers = [];
        fields.innerHTML = "";

        const updateRangeProgress = (range) => {
          const min = Number(range.min || 0);
          const max = Number(range.max || 100);
          const value = Number(range.value || 0);
          const progress = max > min ? ((value - min) / (max - min)) * 100 : 0;
          range.style.setProperty("--range-progress", `${Math.max(0, Math.min(100, progress))}%`);
        };

        const renderNumberField = (field, options = {}) => {
          const label = document.createElement("label");
          label.className = options.mini ? "tool-fee-rate" : "tool-field";
          label.dataset.field = field.key;

          const span = document.createElement("span");
          span.textContent = typeof field.label === "function" ? field.label(values) : field.label;
          label.append(span);

          const control = document.createElement("div");
          control.className = "tool-input-wrap";
          const input = document.createElement("input");
          input.type = "text";
          input.inputMode = "decimal";
          input.min = field.min;
          input.max = field.max;
          input.step = field.step;
          input.value = formatInputNumber(values[field.key]);
          const range = document.createElement("input");
          range.className = options.mini ? "tool-range tool-range-mini" : "tool-range";
          range.type = "range";
          range.min = field.min;
          range.max = field.max;
          range.step = field.step;
          range.value = values[field.key];
          updateRangeProgress(range);

          const note = field.note ? document.createElement("small") : null;
          const updateNote = () => {
            if (!note) return;
            note.textContent = typeof field.note === "function" ? field.note(values) : field.note;
          };
          const refreshField = () => {
            span.textContent = typeof field.label === "function" ? field.label(values) : field.label;
            updateNote();
          };
          fieldRefreshers.push(refreshField);
          const refreshDependentFields = () => fieldRefreshers.forEach((refresh) => refresh());
          const updatePresets = () => {
            if (!presetRow) return;
            presetRow.querySelectorAll(".tool-preset").forEach((button) => {
              button.classList.toggle("is-active", values[field.key] === Number(button.dataset.value));
            });
          };

          input.addEventListener("input", () => {
            values[field.key] = parseInputNumber(input.value);
            range.value = values[field.key];
            updateRangeProgress(range);
            refreshDependentFields();
            updatePresets();
            renderOutputs();
          });
          input.addEventListener("blur", () => {
            input.value = formatInputNumber(values[field.key]);
          });
          range.addEventListener("input", () => {
            values[field.key] = Number(range.value || 0);
            input.value = formatInputNumber(values[field.key]);
            updateRangeProgress(range);
            refreshDependentFields();
            updatePresets();
            renderOutputs();
          });
          const suffix = document.createElement("small");
          suffix.textContent = field.suffix;
          control.append(input, suffix);
          label.append(control);

          let presetRow = null;
          if (field.presets) {
            presetRow = document.createElement("div");
            presetRow.className = "tool-presets";
            field.presets.forEach((preset) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "tool-preset";
              button.dataset.value = preset;
              button.textContent = `${preset} ${field.suffix}`;
              button.classList.toggle("is-active", values[field.key] === preset);
              button.addEventListener("click", () => {
                values[field.key] = preset;
                input.value = formatInputNumber(values[field.key]);
                range.value = values[field.key];
                updateRangeProgress(range);
                refreshDependentFields();
                updatePresets();
                renderOutputs();
              });
              presetRow.append(button);
            });
            label.append(presetRow);
          }

          label.append(range);

          if (note) {
            note.className = "tool-field-note";
            updateNote();
            label.append(note);
          }

          return label;
        };

        const renderSelectField = (field) => {
          const label = document.createElement("label");
          label.className = "tool-field tool-select-field";

          const span = document.createElement("span");
          span.textContent = typeof field.label === "function" ? field.label(values) : field.label;

          const control = document.createElement("div");
          control.className = "tool-select-wrap";
          const select = document.createElement("select");
          select.setAttribute("aria-label", span.textContent);
          field.options.forEach((optionValue) => {
            const option = document.createElement("option");
            option.value = optionValue;
            const unit = optionValue === 1 ? "part" : "parts";
            option.textContent = `${formatInputNumber(optionValue)} ${unit}`;
            option.selected = values[field.key] === optionValue;
            select.append(option);
          });
          select.addEventListener("change", () => {
            values[field.key] = Number(select.value);
            renderOutputs();
          });
          control.append(select);
          label.append(span, control);
          return label;
        };

        const renderFees = () => {
          const feeGroup = document.createElement("div");
          feeGroup.className = "tool-fee-group";

          [
            {
              toggleKey: "fraisEntreeActifs",
              valueKey: "fraisEntree",
              label: "Droits d'entrée",
              rateLabel: "Taux",
              max: 4.8
            },
            {
              toggleKey: "fraisActifs",
              valueKey: "frais",
              label: "Frais de gestion",
              rateLabel: "Taux annuel",
              max: 3
            }
          ].forEach((fee) => {
            const card = document.createElement("div");
            card.className = "tool-fee-card";
            const toggle = document.createElement("label");
            toggle.className = "tool-fee-toggle";
            const title = document.createElement("span");
            title.textContent = fee.label;
            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = values[fee.toggleKey];
            input.addEventListener("change", () => {
              values[fee.toggleKey] = input.checked;
              withHeightTransition(document.querySelector(".tool-params"), () => {
                renderFields();
                renderOutputs();
              });
            });
            toggle.append(title, input);
            card.append(toggle);

            if (values[fee.toggleKey]) {
              card.append(renderNumberField({
                key: fee.valueKey,
                label: fee.rateLabel,
                type: "number",
                min: 0,
                max: fee.max,
                step: 0.1,
                suffix: "%"
              }, { mini: true }));
            }

            feeGroup.append(card);
          });

          fields.append(feeGroup);
        };

        fieldDefinitions[state.mode].forEach((field) => {
          if (field.dependsOn && !values[field.dependsOn]) return;
          if (state.mode === "av" && ["fraisEntreeActifs", "fraisEntree", "fraisActifs", "frais"].includes(field.key)) return;

          if (field.type === "select") {
            fields.append(renderSelectField(field));
            return;
          }

          if (field.type !== "checkbox") {
            fields.append(renderNumberField(field));
            return;
          }

          const label = document.createElement("label");
          label.className = "tool-switch-row";

          const span = document.createElement("span");
          span.textContent = typeof field.label === "function" ? field.label(values) : field.label;
          label.append(span);

          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = values[field.key];
          input.addEventListener("change", () => {
            values[field.key] = input.checked;
            withHeightTransition(document.querySelector(".tool-params"), render);
          });
          label.append(input);

          fields.append(label);

          if (field.checkedNote && values[field.key]) {
            const note = document.createElement("small");
            note.className = "tool-field-note";
            note.textContent = field.checkedNote;
            fields.append(note);
          }
        });

        if (state.mode === "av") renderFees();
      }

      function renderSummary(rows) {
        const last = rows.at(-1) || {};
        const summary = document.querySelector("#summary");

        if (state.mode === "av") {
          const values = state.values.av;
          const capital = last.capital || 0;
          const invested = last.versementsCumules || 0;
          const interests = last.interetsCumules || 0;
          const investedShare = capital > 0 ? Math.max(0, Math.min(100, (invested / capital) * 100)) : 0;
          const interestsShare = Math.max(0, 100 - investedShare);
          const previousGauge = state.previousGauge.av || { investedShare, interestsShare };
          const multiple = invested > 0 ? capital / invested : 0;
          const annualRate = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 }).format(values.rendement);

          summary.innerHTML = `
            <article class="tool-result-card tool-result-editorial av-result">
              <div class="tool-summary-title">
                <h2>Projection</h2>
              </div>
              <div class="tool-hero tool-hero-single">
                <div class="tool-hero-panel tool-hero-panel-blue">
                  <span class="tool-hero-label">Capital final estimé</span>
                  <strong class="tool-hero-amount value-update">${formatMoney(capital)}</strong>
                </div>
              </div>
              <div class="capital-gauge">
                <div class="capital-breakdown-labels">
                  <span class="capital-metric-invested"><em>Sommes investies</em><strong>${formatNumber(investedShare)} %</strong></span>
                  <span class="capital-metric-interest"><em>Intérêts gagnés</em><strong>${formatNumber(interestsShare)} %</strong></span>
                </div>
                <div class="capital-breakdown" aria-label="Répartition du capital final">
                  <div style="width:${previousGauge.investedShare}%"></div>
                  <div style="width:${previousGauge.interestsShare}%"></div>
                </div>
              </div>
              <div class="capital-metrics">
                <span class="capital-metric-invested"><small>Sommes investies</small><strong class="value-update">${formatMoney(invested)}</strong></span>
                <span class="capital-metric-interest"><small>Intérêts gagnés</small><strong class="value-update">${formatMoney(interests)}</strong></span>
              </div>
              <div class="capital-shares">
                <span><small>Multiple obtenu</small><strong class="value-update">× ${multiple.toFixed(2)}</strong></span>
                <span><small>Part des intérêts gagnés</small><strong class="value-update">${formatNumber(interestsShare)} %</strong></span>
              </div>
              <div class="capital-insight">
                <div class="capital-visual" aria-label="Répartition visuelle du capital projeté">
                  <span style="width:${investedShare}%"></span>
                  <span style="width:${interestsShare}%"></span>
                </div>
                <p>
                  En plaçant ${formatMoney(values.capitalInitial)} aujourd'hui, puis ${formatMoney(values.versementMensuel)}
                  chaque mois pendant ${formatNumber(values.dureeTotale)} ans, à un rendement annuel moyen de
                  ${annualRate} %, votre assurance vie atteindrait ${formatMoney(capital)}.
                </p>
              </div>
            </article>
          `;
          state.previousGauge.av = { investedShare, interestsShare };
          requestAnimationFrame(() => {
            const [investedBar, interestsBar] = summary.querySelectorAll(".capital-breakdown > div");
            if (!investedBar || !interestsBar) return;
            investedBar.style.width = `${investedShare}%`;
            interestsBar.style.width = `${interestsShare}%`;
          });
          return;
        }

        if (state.mode === "scpi") {
          const values = state.values.scpi;
          const loyerMensuelFin = last.revenuMensuel || 0;
          const totalLoyers = last.revenusCumules || 0;
          const effortMensuel = values.versementMensuel;
          const capitalFinal = last.capital || 0;
          const partInitiale = capitalFinal > 0 ? values.versementInitial / capitalFinal : 0;
          const revenuInitial = loyerMensuelFin * partInitiale;
          const revenuEffort = loyerMensuelFin - revenuInitial;
          const immediateFlow = scpiImmediateFlowRevenu(revenuInitial);
          const viagerFlow = scpiFlowRevenu(revenuEffort);
          const moneyMarkup = (amount) => `<span class="scpi-money-value">${formatMoney(amount).replace(/\s?€$/, "")}</span><small class="scpi-money-unit">€</small>`;
          const flowSecondaryMarkup = (flow) => {
            if (flow.secondaryValue !== undefined) {
              return `<span class="scpi-flow-annual"><span>soit </span>${moneyMarkup(flow.secondaryValue)}<span> ${flow.secondaryPeriod}</span></span>`;
            }
            if (flow.showAnnual) return `<span class="scpi-flow-annual">${moneyMarkup(flow.annual)}<span> par an</span></span>`;
            return "";
          };
          const flowAmountMarkup = (flow) => `
            <strong class="scpi-flow-amount value-update">${moneyMarkup(flow.value)}<small class="scpi-flow-period">${flow.unit}</small></strong>
            ${flowSecondaryMarkup(flow)}
          `;

          summary.innerHTML = `
            <article class="tool-result-card tool-result-editorial">
              <div class="tool-summary-title">
                <h2>Projection</h2>
              </div>
              <div class="tool-hero">
                <div class="tool-hero-panel tool-hero-panel-blue">
                  <span class="tool-hero-label">Patrimoine immobilier final</span>
                  <strong class="tool-hero-amount value-update">${moneyMarkup(last.capital)}</strong>
                </div>
                <div class="tool-hero-panel tool-hero-panel-gold">
                  <span class="tool-hero-label">Loyer mensuel viager</span>
                  <strong class="tool-hero-amount value-update">${moneyMarkup(loyerMensuelFin)}<small class="tool-hero-currency">/mois<span class="tool-hero-lifetime">—&nbsp;à vie</span></small></strong>
                </div>
              </div>
              <div class="scpi-flow-grid">
              ${immediateFlow ? `
              <div class="scpi-flow is-open" data-flow="immediate" aria-label="Mécanique du versement initial : capital versé aujourd'hui, loyer généré dès le premier mois">
                <div class="scpi-flow-step scpi-flow-effort">
                  <span class="scpi-flow-label">Versement initial</span>
                  <strong class="scpi-flow-amount value-update">${moneyMarkup(values.versementInitial)}</strong>
                </div>
                <div class="scpi-flow-reveal" id="scpi-reveal-immediate">
                  <div class="scpi-flow-step scpi-flow-revenu">

                  </div>
                </div>
              </div>
              ` : ""}
              ${viagerFlow ? `
              <div class="scpi-flow is-open" data-flow="viager" aria-label="Mécanique du versement programmé : effort mensuel pendant la phase d'épargne, loyer viager ensuite">
                <div class="scpi-flow-step scpi-flow-effort">
                  <span class="scpi-flow-label">Versement programmé</span>
                  <strong class="scpi-flow-amount value-update">${moneyMarkup(effortMensuel)}<small class="scpi-flow-period">/mois</small></strong>
                  <span class="scpi-flow-duration">pendant ${values.dureeVersements} ans</span>
                </div>
                <div class="scpi-flow-reveal" id="scpi-reveal-viager">
                  <div class="scpi-flow-step scpi-flow-revenu">
                    <span class="scpi-flow-label">Loyer perçu<br>à terme</span>
                    ${flowAmountMarkup(viagerFlow)}
                  </div>
                </div>
              </div>
              ` : ""}
              </div>
              <div class="scpi-summary-row">
                <div class="capital-shares">
                  <span><small>Total des loyers perçus</small><strong class="value-update">${moneyMarkup(totalLoyers)}</strong></span>
                </div>
                <div class="capital-insight">
                  <p>
                    Ce loyer de <strong class="scpi-insight-income">${moneyMarkup(loyerMensuelFin)}<small class="scpi-flow-period">/mois</small></strong> continue à vie, sans nouvel effort de votre part, tant que vous détenez vos parts.
                  </p>
                </div>
              </div>
            </article>
          `;

          return;
        }

        const values = state.values.per;
        const result = computePerResult(values);
        const effectiveCost = Math.max(0, result.deductible - result.gain);
        const gainRate = result.deductible > 0 ? result.gain / result.deductible * 100 : 0;
        const change = result.tmiBefore !== result.tmiAfter;
        summary.innerHTML = `
          <article class="tool-result-card tool-result-editorial per-result">
            <div class="per-result-hero">
              <div class="per-result-main-value">
                <small>Votre économie d'impôt estimée</small>
                <strong class="value-update">${formatMoney(result.gain)}</strong>
              </div>
              <div class="per-real-cost">
                <small>Votre versement de ${formatMoney(result.deductible)}</small>
                <span>vous coûte réellement</span>
                <strong>${formatMoney(effectiveCost)}</strong>
              </div>
            </div>
            <div class="per-tax-flow" aria-label="Comparaison de l'impôt avant et après versement PER">
              <div><small>Imposition actuelle</small><strong>${formatMoney(result.taxBefore)}</strong></div>
              <div><small>Imposition après versement PER</small><strong>${formatMoney(result.taxAfter)}</strong></div>
              <div class="per-tax-saving"><small>Économie d'impôt</small><strong>${formatMoney(result.gain)}</strong></div>
            </div>
            <div class="per-key-metrics">
              <div>
                <small>Montant épargné <i>vs</i> effort d'épargne réel</small>
                <strong>${formatMoney(result.deductible)} <i>→</i> ${formatMoney(effectiveCost)}</strong>
              </div>
              <div>
                <small>TMI avant <i>/</i> TMI après</small>
                <strong>${formatNumber(result.tmiBefore * 100)} % <i>→</i> ${formatNumber(result.tmiAfter * 100)} %</strong>
                ${change ? '<em>Tranche réduite</em>' : '<em>TMI stable</em>'}
              </div>
            </div>
            <div class="capital-insight per-insight">
              <p>
                Chaque euro versé vous procure ici environ ${formatPercent(gainRate)} centimes d'économie d'impôt.
                Votre effort net est ramené à ${formatMoney(effectiveCost)} pour ${formatMoney(result.deductible)} investis sur votre PER.
              </p>
            </div>
            <p class="per-disclaimer">Calcul indicatif selon le barème IR 2026, hors décote, plafonnement du quotient familial et dispositifs spécifiques.</p>
          </article>
        `;
      }

      // Le graphique ne compare plus "versé" et "loyers perçus" (une course qui semble
      // perdue tant que le point de bascule n'est pas atteint) : il montre uniquement la
      // progression du loyer mensuel lui-même, avec des jalons chiffrés à quelques années
      // clés. Le total versé reste visible en contexte, mais en retrait.
      function renderRentGrowthChart(rows) {
        const chart = document.querySelector("#chart");
        const animateBars = chart.dataset.initialized !== "true";
        const width = 960;
        const height = 400;
        const pad = { top: 72, right: 36, bottom: 54, left: 128 };
        const values = state.values.scpi;

        const rentSeries = rows.map((row) => row.revenuMensuel || 0);
        const lastYear = rows.length;
        const hasIncomePhase = values.dureeVersements < lastYear;

        // Un jalon tous les 10 ans d'investissement, jusqu'à l'année où les versements
        // s'arrêtent : au-delà, le loyer ne bouge plus (il devient viager), donc la
        // série de jalons s'arrête là plutôt que de continuer à afficher des décennies
        // qui répéteraient le même montant. Ce jalon final devient le loyer viager.
        const viagerYear = values.dureeVersements >= 1 && values.dureeVersements < rows.length
          ? values.dureeVersements
          : null;
        const finalMilestoneYear = viagerYear !== null ? viagerYear : lastYear;

        const candidateYears = new Set();
        for (let annee = 10; annee <= finalMilestoneYear; annee += 10) candidateYears.add(annee);
        candidateYears.add(finalMilestoneYear);
        const milestoneYears = Array.from(candidateYears).sort((a, b) => a - b);

        const max = Math.max(...rentSeries, 1);
        const scaleMax = max * 1.08;
        const plotWidth = width - pad.left - pad.right;
        const x = (index) => pad.left + (index / Math.max(rows.length - 1, 1)) * (width - pad.left - pad.right);
        const y = (value) => height - pad.bottom - (value / scaleMax) * (height - pad.top - pad.bottom);
        const baseline = height - pad.bottom;

        // Barres plutôt que courbe lissée : effet "relevé de compte qui grossit chaque
        // année", plus parlant qu'une simple diagonale. Les jalons se détachent en couleur
        // pleine (le dernier en encre) sur le fond dégradé des barres courantes.
        const barSlot = plotWidth / Math.max(rows.length, 1);
        const barWidth = Math.max(2, barSlot * 0.62);
        const barRadius = Math.min(4, barWidth / 2);
        const bars = rentSeries.map((value, index) => {
          const annee = index + 1;
          const topY = y(value);
          const barHeight = Math.max(0, baseline - topY);
          const phaseClass = annee <= values.dureeVersements ? "chart-bar-investment" : "chart-bar-income";
          const classes = ["chart-bar", phaseClass];
          if (animateBars) classes.push("chart-bar-enter");
          if (milestoneYears.includes(annee)) classes.push("chart-bar-milestone");
          if (annee === finalMilestoneYear) classes.push("chart-bar-final");
          const animationStyle = animateBars ? ` style="--bar-delay: ${index * 9}ms"` : "";
          return `<rect class="${classes.join(" ")}"${animationStyle} x="${(x(index) - barWidth / 2).toFixed(2)}" y="${topY.toFixed(2)}" width="${barWidth.toFixed(2)}" height="${barHeight.toFixed(2)}" rx="${barRadius.toFixed(2)}"></rect>`;
        }).join("");

        const grid = niceValueTicks(max, 4).map((value) => {
          const lineY = y(value);
          return `
            <g>
              <line x1="${pad.left}" y1="${lineY}" x2="${width - pad.right}" y2="${lineY}" />
              <text x="${pad.left - 16}" y="${lineY + 5}">${formatMoney(value)}</text>
            </g>
          `;
        }).join("");
        const ticks = niceYearTicks(rows.length).map((annee) => {
          const tickX = x(annee - 1);
          return `<text x="${tickX}" y="${height - 10}">${annee}</text>`;
        }).join("");

        // Jalons affichés en cartouches sous le graphique plutôt qu'en texte flottant
        // sur les barres : lisible à toutes les tailles, sans risque de chevauchement.
        const milestoneChips = milestoneYears.map((annee) => {
          const value = rentSeries[annee - 1];
          const isFinal = annee === finalMilestoneYear;
          const label = annee === viagerYear ? `Année ${annee} · Loyer viager` : `Année ${annee}`;
          return `
            <div class="chart-milestone-chip${isFinal ? " chart-milestone-chip-final" : ""}">
              <span>${label}</span>
              <strong>${formatMoney(value)}<small>/mois</small></strong>
            </div>
          `;
        }).join("");

        chart.innerHTML = `
          <div class="chart-milestone-strip" style="grid-template-columns: repeat(${milestoneYears.length}, 1fr)">${milestoneChips}</div>
          <div class="chart-canvas">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Évolution du loyer mensuel perçu au fil des années">
              <defs>
                <linearGradient id="chartAreaGains" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ad8143" stop-opacity="0.98"></stop>
                  <stop offset="52%" stop-color="#c29a60" stop-opacity="0.9"></stop>
                  <stop offset="100%" stop-color="#6f879d" stop-opacity="0.68"></stop>
                </linearGradient>
                <linearGradient id="chartAreaIncome" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#a97836" stop-opacity="0.98"></stop>
                  <stop offset="55%" stop-color="#caa466" stop-opacity="0.9"></stop>
                  <stop offset="100%" stop-color="#e5cfaa" stop-opacity="0.72"></stop>
                </linearGradient>
              </defs>
              <g class="chart-grid">${grid}</g>
              <g class="chart-bars">${bars}</g>
              <g class="chart-axis">${ticks}</g>
              <g class="chart-hover">
                <line class="chart-hover-line" x1="0" y1="${pad.top}" x2="0" y2="${height - pad.bottom}"></line>
                <circle class="chart-hover-dot chart-hover-dot-gains" r="4"></circle>
              </g>
            </svg>
            <div class="chart-tooltip">
              <span class="chart-tooltip-year"></span>
              <div class="chart-tooltip-row chart-tooltip-gains"><small>Loyer</small><strong></strong></div>
            </div>
          </div>
          <div class="chart-legend">
            <span><i class="legend-investment-phase"></i>Phase d’investissement</span>
            ${hasIncomePhase ? '<span><i class="legend-income-phase"></i>Phase de rente</span>' : ""}
          </div>
        `;

        chart.dataset.initialized = "true";
        setupRentGrowthHover(chart, rows, { x, y, pad, width, height, rentSeries, hoverScaleY: 1.08 });
      }

      function setupRentGrowthHover(chart, rows, ctx) {
        const svg = chart.querySelector("svg");
        const canvas = chart.querySelector(".chart-canvas");
        const hoverGroup = chart.querySelector(".chart-hover");
        const hoverLine = chart.querySelector(".chart-hover-line");
        const hoverDot = chart.querySelector(".chart-hover-dot-gains");
        const tooltip = chart.querySelector(".chart-tooltip");
        const tooltipYear = chart.querySelector(".chart-tooltip-year");
        const tooltipRent = chart.querySelector(".chart-tooltip-gains strong");
        const barElements = chart.querySelectorAll(".chart-bar");
        let activeBar = null;
        if (!svg || !rows.length) return;

        hoverGroup.style.display = "none";
        tooltip.hidden = true;

        const updateAt = (clientX, clientY) => {
          const point = svg.createSVGPoint();
          point.x = clientX;
          point.y = clientY;
          const ctm = svg.getScreenCTM();
          if (!ctm) return;
          const local = point.matrixTransform(ctm.inverse());
          const ratio = (local.x - ctx.pad.left) / (ctx.width - ctx.pad.left - ctx.pad.right);
          const index = Math.max(0, Math.min(rows.length - 1, Math.round(ratio * (rows.length - 1))));
          const row = rows[index];
          const px = ctx.x(index);
          const py = ctx.y(ctx.rentSeries[index]);
          const baseline = ctx.height - ctx.pad.bottom;
          const visualPy = baseline - (baseline - py) * ctx.hoverScaleY;

          if (activeBar !== barElements[index]) {
            activeBar?.classList.remove("is-hovered");
            activeBar = barElements[index];
            activeBar?.classList.add("is-hovered");
          }

          hoverGroup.style.display = "";
          hoverLine.setAttribute("x1", px);
          hoverLine.setAttribute("x2", px);
          hoverDot.setAttribute("cx", px);
          hoverDot.setAttribute("cy", visualPy);

          tooltipYear.textContent = `Année ${row.annee}`;
          tooltipRent.textContent = `${formatMoney(ctx.rentSeries[index])}/mois`;

          const screenPoint = svg.createSVGPoint();
          screenPoint.x = px;
          // L'infobulle reste ancrée au sommet de la ligne de repère : seule sa
          // position horizontale suit la barre survolée.
          screenPoint.y = ctx.pad.top;
          const screenPos = screenPoint.matrixTransform(ctm);
          const canvasRect = canvas.getBoundingClientRect();
          tooltip.hidden = false;
          tooltip.style.left = `${screenPos.x - canvasRect.left}px`;
          tooltip.style.top = `${screenPos.y - canvasRect.top}px`;
        };

        const hide = () => {
          activeBar?.classList.remove("is-hovered");
          activeBar = null;
          hoverGroup.style.display = "none";
          tooltip.hidden = true;
        };

        svg.addEventListener("mousemove", (event) => updateAt(event.clientX, event.clientY));
        svg.addEventListener("mouseleave", hide);
        svg.addEventListener("touchmove", (event) => {
          const touch = event.touches[0];
          if (touch) updateAt(touch.clientX, touch.clientY);
        }, { passive: true });
        svg.addEventListener("touchend", hide);
      }

      function renderChart(rows) {
        if (state.mode === "scpi") {
          renderRentGrowthChart(rows);
          return;
        }
        if (state.mode === "per") {
          renderPerChart();
          return;
        }

        const chart = document.querySelector("#chart");
        const width = 960;
        const height = 380;
        const pad = { top: 28, right: 36, bottom: 54, left: 128 };
        const metric = state.mode === "av" ? "interetsCumules" : "gainsCumules";
        const metricLabel = state.mode === "av" ? "Intérêts gagnés" : "Gains cumulés";

        const investedSeries = rows.map((row) => Math.max(0, row.versementsCumules || 0));
        const capitalSeries = rows.map((row, i) => Math.max(investedSeries[i], row.capital || 0));
        const max = Math.max(...capitalSeries, 1);

        const x = (index) => pad.left + (index / Math.max(rows.length - 1, 1)) * (width - pad.left - pad.right);
        const y = (value) => height - pad.bottom - (value / max) * (height - pad.top - pad.bottom);
        const pointsFor = (series) => series.map((value, index) => `${x(index)},${y(value)}`).join(" ");
        const areaPath = (lowerSeries, upperSeries) => {
          const top = upperSeries.map((value, index) => `${x(index)},${y(value)}`);
          const bottom = lowerSeries.map((value, index) => `${x(index)},${y(value)}`).reverse();
          return `M${top.join(" L")} L${bottom.join(" L")} Z`;

      function setupChartHover(chart, rows, ctx) {
        const svg = chart.querySelector("svg");
        const canvas = chart.querySelector(".chart-canvas");
        const hoverGroup = chart.querySelector(".chart-hover");
        const hoverLine = chart.querySelector(".chart-hover-line");
        const hoverDotCapital = chart.querySelector(".chart-hover-dot-capital");
        const hoverDotInvested = chart.querySelector(".chart-hover-dot-invested");
        const tooltip = chart.querySelector(".chart-tooltip");
        const tooltipYear = chart.querySelector(".chart-tooltip-year");
        const tooltipCapital = chart.querySelector(".chart-tooltip-capital strong");
        const tooltipGains = chart.querySelector(".chart-tooltip-gains strong");
        const tooltipInvested = chart.querySelector(".chart-tooltip-invested strong");
        if (!svg || !rows.length) return;

        hoverGroup.style.display = "none";
        tooltip.hidden = true;

        const updateAt = (clientX, clientY) => {
          const point = svg.createSVGPoint();
          point.x = clientX;
          point.y = clientY;
          const ctm = svg.getScreenCTM();
          if (!ctm) return;
          const local = point.matrixTransform(ctm.inverse());
          const ratio = (local.x - ctx.pad.left) / (ctx.width - ctx.pad.left - ctx.pad.right);
          const index = Math.max(0, Math.min(rows.length - 1, Math.round(ratio * (rows.length - 1))));
          const row = rows[index];
          const px = ctx.x(index);
          const capitalY = ctx.y(ctx.capitalSeries[index]);
          const investedY = ctx.y(ctx.investedSeries[index]);

          hoverGroup.style.display = "";
          hoverLine.setAttribute("x1", px);
          hoverLine.setAttribute("x2", px);
          hoverDotCapital.setAttribute("cx", px);
          hoverDotCapital.setAttribute("cy", capitalY);
          hoverDotInvested.setAttribute("cx", px);
          hoverDotInvested.setAttribute("cy", investedY);

          tooltipYear.textContent = `Année ${row.annee}`;
          tooltipCapital.textContent = formatMoney(roundToHundred(row.capital));
          tooltipGains.textContent = formatMoney(roundToHundred(row[ctx.metric]));
          tooltipInvested.textContent = formatMoney(roundToHundred(row.versementsCumules));

          const screenPoint = svg.createSVGPoint();
          screenPoint.x = px;
          screenPoint.y = capitalY;
          const screenPos = screenPoint.matrixTransform(ctm);
          const canvasRect = canvas.getBoundingClientRect();
          tooltip.hidden = false;
          tooltip.style.left = `${screenPos.x - canvasRect.left}px`;
          tooltip.style.top = `${screenPos.y - canvasRect.top}px`;
        };

        const hide = () => {
          hoverGroup.style.display = "none";
          tooltip.hidden = true;
        };

        svg.addEventListener("mousemove", (event) => updateAt(event.clientX, event.clientY));
        svg.addEventListener("mouseleave", hide);
        svg.addEventListener("touchmove", (event) => {
          const touch = event.touches[0];
          if (touch) updateAt(touch.clientX, touch.clientY);
        }, { passive: true });
        svg.addEventListener("touchend", hide);
      }

        const gainsShare = 100 - investedShare;

        const size = 340;
        const strokeWidth = 40;
        const radius = (size - strokeWidth) / 2;
        const circumference = 2 * Math.PI * radius;
        const segmentGap = 8;
        const investedFull = (investedShare / 100) * circumference;
        const gainsFull = circumference - investedFull;
        const investedDrawn = Math.max(0, investedFull - segmentGap);
        const gainsDrawn = Math.max(0, gainsFull - segmentGap);
        const investedOffset = segmentGap / 2;
        const gainsOffset = investedFull + segmentGap / 2;
        const capitalAmount = formatMoney(last.capital).replace(/\s?€$/, "");

        panel.innerHTML = `
          <div class="pie-layout">
            <div class="pie-canvas">
              <svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Répartition du capital final entre sommes investies et ${metricLabel.toLowerCase()}">
                <defs>
                  <linearGradient id="pieInvested" x1="0" y1="0" x2="1" y2="1">

                <circle class="pie-segment pie-segment-invested" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}"
                  stroke-dasharray="${investedDrawn} ${circumference - investedDrawn}" stroke-dashoffset="${-investedOffset}"></circle>
                <circle class="pie-segment pie-segment-gains" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}"
                  stroke-dasharray="${gainsDrawn} ${circumference - gainsDrawn}" stroke-dashoffset="${-gainsOffset}"></circle>
              </svg>
              <div class="pie-center">

      const SCPI_TABLE_YEARS = [1, 2, 3, 4, 5, 10, 15, 20, 30, 40, 50, 60, 70, 80];

      function renderTable(rows) {
        const table = document.querySelector("#projection-table");
        let headers;

        if (state.mode === "scpi") {

            `${formatMoney(row.versement)} (${formatMoney(row.versement / 12)}/mois)`,

      const PS_RATE = 17.2;
      const TMI_BRACKETS = [0, 11, 30, 41, 45];

      function computeFiscalImpact(revenuAnnuelBrut, tmi) {
        const irAmount = revenuAnnuelBrut * (tmi / 100);
        const psAmount = revenuAnnuelBrut * (PS_RATE / 100);
        return {
          francaise: {
            irShare: tmi,
            psShare: PS_RATE,
            irAmount,
            psAmount,
            totalRate: tmi + PS_RATE,
            net: revenuAnnuelBrut - irAmount - psAmount
          },
          etrangere: {
            irShare: tmi,
            psShare: 0,
            irAmount,
            psAmount: 0,
            totalRate: tmi,
            net: revenuAnnuelBrut - irAmount
          }
        };
      }

      function fiscalDonut(irShare, psShare, label) {
        const size = 176;
        const strokeWidth = 22;
        const radius = (size - strokeWidth) / 2;
        const circumference = 2 * Math.PI * radius;
        const gap = 5;
        let cursor = 0;
        const parts = [
          { share: irShare, className: "fiscal-donut-ir" },
          { share: psShare, className: "fiscal-donut-ps" }
        ];
        const circles = parts.map((part) => {
          if (part.share <= 0) return "";
          const full = (part.share / 100) * circumference;
          const hasGap = part.share < 100;
          const drawn = Math.max(0, full - (hasGap ? gap : 0));
          const offset = cursor + (hasGap ? gap / 2 : 0);
          cursor += full;
          return `<circle class="fiscal-donut-segment ${part.className}" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}" stroke-dasharray="${drawn} ${circumference - drawn}" stroke-dashoffset="${-offset}"></circle>`;
        }).join("");
        return `
          <svg viewBox="0 0 ${size} ${size}" class="fiscal-donut" role="img" aria-label="${label}">
            <circle class="fiscal-donut-track" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}"></circle>
            ${circles}
          </svg>
        `;
      }

              <li class="fiscal-line-ps${hasPS ? "" : " fiscal-line-void"}"><span>Prélèvements sociaux${hasPS ? ` (${formatPercent(PS_RATE)} %)` : ""}</span><strong>${hasPS ? formatMoney(data.psAmount) : "Supprimés"}</strong></li>
              <li class="fiscal-line-net"><span>Loyer net</span><strong>${formatMoney(data.net)}</strong></li>

      const LIVRET_A_PRESETS = [1.7, 2, 2.4, 3];

      function animateValue(el, from, to, duration = 700) {
        const token = (el._animateToken = (el._animateToken || 0) + 1);
        const start = performance.now();
        const step = (now) => {
          if (el._animateToken !== token) return;
          const progress = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          el.textContent = formatMoney(from + (to - from) * eased).replace(/\s?€$/, "");
          if (progress < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

        const livretFinal = livretSeries.at(-1) || 0;
        const ecart = Math.max(0, avFinal - livretFinal);
        const livretShare = avFinal > 0 ? Math.max(0, Math.min(100, (livretFinal / avFinal) * 100)) : 0;
        const previous = state.previousGauge.compare || { ecart: 0, livretShare: 0 };

        chart.innerHTML = `
          ${renderCompareSubtabs()}
          <div class="capital-heading">
            <div>
              <span>Manque à gagner sur ${formatNumber(values.dureeTotale)} ans en restant sur un Livret A</span>
              <strong class="capital-amount value-update"><span class="compare-shock-value">${formatMoney(previous.ecart).replace(/\s?€$/, "")}</span><span class="capital-currency">€</span></strong>
            </div>
          </div>
          <div class="compare-race" aria-label="Comparaison des capitaux finaux entre Livret A et assurance vie">
            <div class="compare-race-row">
              <div class="compare-race-head">
                <span>Livret A <small>${values.tauxLivretA} % net</small></span>
                <strong>${formatMoney(livretFinal)}</strong>
              </div>
              <div class="compare-race-track"><span class="compare-race-bar compare-race-bar-livret" style="width:${previous.livretShare}%"></span></div>
            </div>
            <div class="compare-race-row">
              <div class="compare-race-head">
                <span>Assurance Vie <small>${values.rendement} %</small></span>
                <strong>${formatMoney(avFinal)}</strong>
              </div>
              <div class="compare-race-track"><span class="compare-race-bar compare-race-bar-av" style="width:100%"></span></div>
            </div>
          </div>
          <p class="capital-insight">
            En plaçant ${formatMoney(values.capitalInitial)} aujourd'hui puis ${formatMoney(values.versementMensuel)} chaque mois pendant ${formatNumber(values.dureeTotale)} ans,
            un Livret A à ${formatPercent(values.tauxLivretA)}&nbsp;% plafonnerait à ${formatMoney(livretFinal)}, contre ${formatMoney(avFinal)} pour l'assurance vie à
            ${formatPercent(values.rendement)}&nbsp;% : c'est ${formatMoney(ecart)} que le client laisse sur la table en restant sur un placement sans risque.
          </p>
          ${renderLivretRateControl(values)}
          ${renderCompareDisclaimer()}
        `;

        state.previousGauge.compare = { ecart, livretShare };
        requestAnimationFrame(() => {
          const bar = chart.querySelector(".compare-race-bar-livret");
          if (bar) bar.style.width = `${livretShare}%`;
          const valueEl = chart.querySelector(".compare-shock-value");
          if (valueEl) animateValue(valueEl, previous.ecart, ecart);
        });
      }

      function renderCompareEvolution(chart, avRows, avSeries, livretSeries, values) {
        const width = 960;
        const height = 380;
        const pad = { top: 28, right: 36, bottom: 54, left: 128 };
        const avAdjusted = avSeries.map((value, i) => Math.max(value, livretSeries[i]));
        const max = Math.max(...avSeries, ...livretSeries, 1);

        const x = (index) => pad.left + (index / Math.max(avRows.length - 1, 1)) * (width - pad.left - pad.right);
        const y = (value) => height - pad.bottom - (value / max) * (height - pad.top - pad.bottom);
        const pointsFor = (series) => series.map((value, index) => `${x(index)},${y(value)}`).join(" ");
        const areaPath = (lowerSeries, upperSeries) => {
          const top = upperSeries.map((value, index) => `${x(index)},${y(value)}`);
          const bottom = lowerSeries.map((value, index) => `${x(index)},${y(value)}`).reverse();
          return `M${top.join(" L")} L${bottom.join(" L")} Z`;
        };
        const zeroSeries = avRows.map(() => 0);

        const grid = niceValueTicks(max, 4).map((value) => {
          const lineY = y(value);
          return `
            <g>
              <line x1="${pad.left}" y1="${lineY}" x2="${width - pad.right}" y2="${lineY}" />
              <text x="${pad.left - 16}" y="${lineY + 5}">${formatMoney(value)}</text>
            </g>
          `;
        }).join("");
        const ticks = niceYearTicks(avRows.length).map((annee) => {
          const tickX = x(annee - 1);
          return `<text x="${tickX}" y="${height - 10}">${annee}</text>`;
        }).join("");

        const avFinal = avSeries.at(-1) || 0;
        const livretFinal = livretSeries.at(-1) || 0;
        const ecart = Math.max(0, avFinal - livretFinal);

        chart.innerHTML = `
          ${renderCompareSubtabs()}
          <div class="chart-totals">
            <span class="capital-metric-invested">Livret A <strong>${formatMoney(livretFinal)}</strong></span>
            <span class="capital-metric-interest">Assurance Vie <strong>${formatMoney(avFinal)}</strong></span>
            <span>Manque à gagner <strong>${formatMoney(ecart)}</strong></span>
          </div>
          <div class="chart-canvas">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Comparaison entre un Livret A et votre assurance vie">
              <defs>
                <linearGradient id="chartAreaInvested" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#6f8ba7" stop-opacity="0.5"></stop>
                  <stop offset="100%" stop-color="#6f8ba7" stop-opacity="0.05"></stop>
                </linearGradient>
                <linearGradient id="chartAreaGains" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#b99761" stop-opacity="0.55"></stop>
                  <stop offset="100%" stop-color="#b99761" stop-opacity="0.08"></stop>
                </linearGradient>
              </defs>
              <g class="chart-grid">${grid}</g>
              <path class="chart-area chart-area-invested" d="${areaPath(zeroSeries, livretSeries)}"></path>
              <path class="chart-area chart-area-gains" d="${areaPath(livretSeries, avAdjusted)}"></path>
              <polyline class="chart-line chart-line-invested" points="${pointsFor(livretSeries)}"></polyline>
              <polyline class="chart-line chart-line-capital" points="${pointsFor(avSeries)}"></polyline>
              <g class="chart-axis">${ticks}</g>
              <g class="chart-hover">
                <line class="chart-hover-line" x1="0" y1="${pad.top}" x2="0" y2="${height - pad.bottom}"></line>
                <circle class="chart-hover-dot chart-hover-dot-capital" r="4"></circle>
                <circle class="chart-hover-dot chart-hover-dot-invested" r="4"></circle>
              </g>
            </svg>
            <div class="chart-tooltip">
              <span class="chart-tooltip-year"></span>
              <div class="chart-tooltip-row chart-tooltip-capital"><small>Assurance Vie</small><strong></strong></div>
              <div class="chart-tooltip-row chart-tooltip-invested"><small>Livret A</small><strong></strong></div>
            </div>
          </div>
          <div class="chart-legend">
            <span><i class="legend-invested"></i>Livret A</span>
            <span><i class="legend-capital"></i>Assurance Vie</span>
          </div>
          ${renderLivretRateControl(values)}
          ${renderCompareDisclaimer()}
        `;

        setupCompareHover(chart, avRows, { x, y, pad, width, avSeries, livretSeries });
      }

      function renderCompare(avRows) {
        const chart = document.querySelector("#compare");
        const values = state.values.av;
        const livretRows = computeLivretA(values);
        const avSeries = avRows.map((row) => row.capital || 0);
        const livretSeries = livretRows.map((row) => row.capital || 0);

        if (state.compareView === "evolution") {
          renderCompareEvolution(chart, avRows, avSeries, livretSeries, values);
        } else {
          renderCompareShock(chart, avSeries, livretSeries, values);
        }

        chart.querySelectorAll("[data-subview]").forEach((button) => {
          button.addEventListener("click", () => {
            state.compareView = button.dataset.subview;
            renderCompare(avRows);
          });
        });
        chart.querySelectorAll("[data-taux]").forEach((button) => {
          button.addEventListener("click", () => {
            values.tauxLivretA = Number(button.dataset.taux);
            renderCompare(avRows);
          });
        });
      }

      function renderOutputs() {
        const rows = rowsForMode();
        const content = modeContent[state.mode];
        document.title = `${content.title} | Simulateur`;
        document.querySelector("#tool-page-title").textContent = content.title;
        document.querySelector(".tool-card-title h2").textContent = content.chartTitle;
        if (state.mode === "per") {
          document.querySelector("#pie-panel .tool-card-title h2").textContent = "Effort réel et avantage fiscal";
          document.querySelector("#table-panel .tool-card-title h2").textContent = "Scénarios de versement";
        }
        renderSummary(rows);
        renderChart(rows);
        renderPie(rows);
        renderTable(rows);
        if (state.mode === "scpi") renderFiscal(rows);
        if (state.mode === "av") renderCompare(rows);
      }

      function render() {
        renderFields();
        renderOutputs();
      }

      document.querySelector("#reset-fields").addEventListener("click", () => {
        state.values[state.mode] = structuredClone(defaults[state.mode]);
        withHeightTransition(document.querySelector(".tool-params"), render);
      });

      if (state.mode === "scpi") {
        document.querySelector("#fiscal-view-button").hidden = false;
      }
      if (state.mode === "av") {
        document.querySelector("#compare-view-button").hidden = false;
      }

      document.querySelectorAll(".tool-view-toggle button").forEach((button) => {
        button.addEventListener("click", () => {
          const applyView = () => {
            state.view = button.dataset.view;
            document.querySelectorAll(".tool-view-toggle button").forEach((item) => {
              item.classList.toggle("is-active", item === button);
            });
            document.querySelector("#chart-panel").hidden = state.view !== "chart";
            document.querySelector("#pie-panel").hidden = state.view !== "pie";
            document.querySelector("#table-panel").hidden = state.view !== "table";
            document.querySelector("#fiscal-panel").hidden = state.view !== "fiscal";
            document.querySelector("#compare-panel").hidden = state.view !== "compare";
          };
          if (document.startViewTransition) {
            document.startViewTransition(applyView);
          } else {
            applyView();
          }
        });
      });

      render();
    </script>
  </body>
</html>
