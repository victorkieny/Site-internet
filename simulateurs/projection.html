    <script>
      const formatMoney = (value) => new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR",
        maximumFractionDigits: 0
      }).format(Math.round(value || 0));

      const formatNumber = (value) => new Intl.NumberFormat("fr-FR", {
        maximumFractionDigits: 0
      }).format(Math.round(value || 0));

      const roundToHundred = (value) => Math.round((value || 0) / 100) * 100;

      const formatPercent = (value) => new Intl.NumberFormat("fr-FR", {
        maximumFractionDigits: 1
      }).format(value || 0);

      function niceStep(range, targetCount) {
        const rawStep = range / Math.max(1, targetCount);
        if (!Number.isFinite(rawStep) || rawStep <= 0) return 1;
        const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
        const residual = rawStep / magnitude;
        let niceResidual;
        if (residual < 1.5) niceResidual = 1;
        else if (residual < 3) niceResidual = 2;
        else if (residual < 7) niceResidual = 5;
        else niceResidual = 10;
        return niceResidual * magnitude;
      }

      // Round, "speakable" axis labels (100 000 / 200 000 / 300 000, année 1 / 5 / 10...)
      // rather than exact fractions of the data — the curve itself stays exact and can
      // simply run a bit past the last labeled gridline.
      function niceValueTicks(max, targetCount = 4) {
        if (!Number.isFinite(max) || max <= 0) return [];
        const step = niceStep(max, targetCount);
        const ticks = [];
        for (let value = step; value <= max + step * 0.001; value += step) {
          ticks.push(Math.round(value));
        }
        return ticks;
      }

      function niceYearTicks(totalYears) {
        if (totalYears <= 1) return [1];
        const step = niceStep(totalYears, 6);
        const ticks = new Set([1]);
        for (let value = step; value < totalYears; value += step) {
          ticks.add(Math.round(value));
        }
        ticks.add(totalYears);
        return Array.from(ticks).sort((a, b) => a - b);
      }

      const defaults = {
        scpi: {
          rendement: 5,
          versementInitial: 10000,
          versementMensuel: 750,
          dureeVersements: 25,
          dureeTotale: 50,
          reinvestir: false,
          tmi: 30
        },
        av: {
          capitalInitial: 10000,
          versementMensuel: 500,
          dureeTotale: 30,
          rendement: 3,
          frais: 0.6,
          fraisActifs: false,
          fraisEntree: 0,
          fraisEntreeActifs: false
        },
        per: {
          capitalInitial: 5000,
          versementMensuel: 400,
          dureeVersements: 25,
          dureeTotale: 30,
          rendement: 4,
          renteActive: false,
          tauxConversion: 4,
          fraisEntree: 0,
          fraisEntreeActifs: false
        }
      };

      const params = new URLSearchParams(window.location.search);
      const requestedMode = params.get("mode");
      const initialMode = ["av", "scpi", "per"].includes(requestedMode) ? requestedMode : "av";

      const state = {
        mode: initialMode,
        view: "chart",
        values: structuredClone(defaults),
        previousGauge: {},
        scpiShowCapital: false
      };

      const modeContent = {
        av: {
          label: "Assurance Vie",
          title: "Assurance Vie",
          description: "Projection de l'encours dans le temps et visualisation des intérêts composés.",
          chartTitle: "Encours projeté"
        },
        scpi: {
          label: "SCPI",
          title: "SCPI",
          description: "Projection des loyers perçus par mois et par an, et de leur progression dans le temps.",
          chartTitle: "Loyers perçus"
        },
        per: {
          label: "PER",
          title: "PER",
          description: "Base de projection dédiée au PER, prête à recevoir le volet fiscal.",
          chartTitle: "Capital retraite"
        }
      };

      function computeScpi(values) {
        const rows = [];
        let versementsCumules = 0;
        let capital = 0;
        let revenusCumules = 0;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = annee <= values.dureeVersements ? values.versementMensuel * 12 : 0;
          if (annee === 1) {
            versementsCumules = values.versementInitial + versementAnnuel;
            capital = versementsCumules;
          } else {
            versementsCumules += versementAnnuel;
            capital += versementAnnuel;
          }

          const revenuAnnuel = capital * (values.rendement / 100);
          const revenuMensuel = revenuAnnuel / 12;
          revenusCumules += revenuAnnuel;

          if (values.reinvestir) {
            capital += revenuAnnuel;
            versementsCumules += revenuAnnuel;
          }

          rows.push({
            annee,
            versementsCumules,
            versementAnnuel,
            revenuMensuel,
            revenuAnnuel,
            revenusCumules,
            capital
          });
        }
        return rows;
      }

      // Argent réellement apporté par l'investisseur (hors loyers réinvestis), pour
      // pouvoir comparer "ce qu'il a versé" à "ce que la SCPI lui a rapporté".
      function scpiApportsSeries(values, rows) {
        let cumule = 0;
        return rows.map((row, index) => {
          cumule += (index === 0 ? values.versementInitial : 0) + row.versementAnnuel;
          return cumule;
        });
      }

      // Première année où les loyers cumulés remboursent la totalité des apports.
      function scpiBreakEvenYear(rows, apportsSeries) {
        for (let index = 0; index < rows.length; index++) {
          if (rows[index].revenusCumules >= apportsSeries[index]) return rows[index].annee;
        }
        return null;
      }

      function computeAssuranceVie(values) {
        const rows = [];
        const rendementNet = Math.max(
          0,
          values.rendement
            - (values.fraisActifs ? values.frais : 0)
        );
        const entreeNet = 1 - (values.fraisEntreeActifs ? values.fraisEntree / 100 : 0);
        let versementsCumules = 0;
        let interetsCumules = 0;
        let capital = 0;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = values.versementMensuel * 12;
          const versementAnnuelNet = versementAnnuel * entreeNet;
          if (annee === 1) {
            const capitalInitialNet = values.capitalInitial * entreeNet;
            versementsCumules = values.capitalInitial + versementAnnuel;
            const interetsAnnuels = capitalInitialNet * (rendementNet / 100);
            interetsCumules += interetsAnnuels;
            capital = capitalInitialNet + versementAnnuelNet + interetsAnnuels;
            rows.push({ annee, versementsCumules, versementAnnuel, interetsAnnuels, interetsCumules, capital });
          } else {
            versementsCumules += versementAnnuel;
            const interetsAnnuels = capital * (rendementNet / 100);
            interetsCumules += interetsAnnuels;
            capital = capital + versementAnnuelNet + interetsAnnuels;
            rows.push({ annee, versementsCumules, versementAnnuel, interetsAnnuels, interetsCumules, capital });
          }
        }
        return rows;
      }

      function computePer(values) {
        const rows = [];
        const entreeNet = 1 - (values.fraisEntreeActifs ? values.fraisEntree / 100 : 0);
        let versementsCumules = 0;
        let gainsCumules = 0;
        let capital = 0;

        for (let annee = 1; annee <= values.dureeTotale; annee++) {
          const versementAnnuel = (annee <= values.dureeVersements ? values.versementMensuel * 12 : 0) * entreeNet;
          if (annee === 1) {
            const capitalInitialNet = values.capitalInitial * entreeNet;
            versementsCumules = capitalInitialNet + versementAnnuel;
            const gainsAnnuels = capitalInitialNet * (values.rendement / 100);
            gainsCumules += gainsAnnuels;
            capital = capitalInitialNet + versementAnnuel + gainsAnnuels;
            rows.push({ annee, versementsCumules, versementAnnuel, gainsAnnuels, gainsCumules, capital });
          } else {
            versementsCumules += versementAnnuel;
            const gainsAnnuels = capital * (values.rendement / 100);
            gainsCumules += gainsAnnuels;
            capital = capital + versementAnnuel + gainsAnnuels;
            const renteMensuelle = values.renteActive && annee === values.dureeTotale
              ? capital * (values.tauxConversion / 100) / 12
              : undefined;
            rows.push({ annee, versementsCumules, versementAnnuel, gainsAnnuels, gainsCumules, capital, renteMensuelle });
          }
        }
        return rows;
      }

      const fieldDefinitions = {
        scpi: [
          { key: "rendement", label: "Taux de distribution", type: "number", min: 0, max: 15, step: 0.1, suffix: "%" },
          { key: "versementInitial", label: "Versement initial", type: "number", min: 0, max: 500000, step: 1000, suffix: "€" },
          { key: "versementMensuel", label: "Versement mensuel", type: "number", min: 0, max: 5000, step: 50, suffix: "€", note: (values) => `Versement annuel : ${formatMoney(values.versementMensuel * 12)}` },
          { key: "dureeVersements", label: "Durée des versements", type: "number", min: 1, max: 50, step: 1, suffix: "ans" },
          { key: "dureeTotale", label: "Durée totale", type: "number", min: 1, max: 80, step: 1, suffix: "ans" },
          { key: "reinvestir", label: "Réinvestir les loyers", type: "checkbox", checkedNote: "Les loyers sont réinjectés dans le capital chaque année." }
        ],
        av: [
          { key: "capitalInitial", label: "Versement initial", type: "number", min: 0, max: 500000, step: 1000, suffix: "€" },
          { key: "versementMensuel", label: "Versement mensuel", type: "number", min: 0, max: 10000, step: 50, suffix: "€" },
          { key: "rendement", label: "Rendement annuel", type: "number", min: 0, max: 15, step: 0.1, suffix: "%" },
          { key: "dureeTotale", label: "Durée totale", type: "number", min: 1, max: 60, step: 1, suffix: "ans" },
          { key: "fraisEntreeActifs", label: "Droits d'entrée", type: "checkbox" },
          { key: "fraisEntree", label: "Taux des droits d'entrée", type: "number", min: 0, max: 4.8, step: 0.1, suffix: "%", dependsOn: "fraisEntreeActifs" },
          { key: "fraisActifs", label: "Frais de gestion annuels", type: "checkbox" },
          { key: "frais", label: "Taux de frais de gestion", type: "number", min: 0, max: 3, step: 0.1, suffix: "%", dependsOn: "fraisActifs" }
        ],
        per: [
          { key: "rendement", label: "Taux de rentabilité", type: "number", min: 0, max: 15, step: 0.1, suffix: "%" },
          { key: "capitalInitial", label: "Capital initial", type: "number", min: 0, max: 500000, step: 1000, suffix: "€" },
          { key: "versementMensuel", label: "Versement mensuel", type: "number", min: 0, max: 10000, step: 50, suffix: "€" },
          { key: "dureeVersements", label: "Durée des versements", type: "number", min: 1, max: 50, step: 1, suffix: "ans" },
          { key: "dureeTotale", label: "Durée totale", type: "number", min: 1, max: 60, step: 1, suffix: "ans" },
          { key: "fraisEntreeActifs", label: "Frais d'entrée", type: "checkbox" },
          { key: "fraisEntree", label: "Taux de frais d'entrée", type: "number", min: 0, max: 4.8, step: 0.1, suffix: "%", dependsOn: "fraisEntreeActifs" },
          { key: "renteActive", label: "Sortie en rente", type: "checkbox" },
          { key: "tauxConversion", label: "Taux de conversion", type: "number", min: 1, max: 10, step: 0.1, suffix: "%", dependsOn: "renteActive" }
        ]
      };

      function rowsForMode() {
        if (state.mode === "scpi") return computeScpi(state.values.scpi);
        if (state.mode === "av") return computeAssuranceVie(state.values.av);
        return computePer(state.values.per);
      }

      function parseInputNumber(value) {
        const normalized = String(value || "")
          .replace(/\s/g, "")
          .replace(",", ".");
        return Number(normalized || 0);
      }

      function formatInputNumber(value) {
        const number = Number(value || 0);
        if (!Number.isFinite(number)) return "";
        const [integer, decimal] = String(number).split(".");
        const formattedInteger = integer.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        return decimal ? `${formattedInteger},${decimal}` : formattedInteger;
      }

      function withHeightTransition(el, mutate) {
        if (!el) {
          mutate();
          return;
        }
        const token = (el._heightTransitionToken = (el._heightTransitionToken || 0) + 1);

        // Undo any leftover inline sizing from a previous run that never
        // reached its cleanup step (e.g. interrupted mid-flight), so this
        // run always starts from the element's true natural/stretched size.
        el.style.transition = "none";
        el.style.height = "";
        el.style.overflow = "";
        const startHeight = el.getBoundingClientRect().height;

        mutate();
        const endHeight = el.getBoundingClientRect().height;

        if (Math.abs(endHeight - startHeight) < 1) return;

        el.style.overflow = "hidden";
        el.style.height = `${startHeight}px`;
        el.getBoundingClientRect();

        requestAnimationFrame(() => {
          if (el._heightTransitionToken !== token) return;
          el.style.transition = "height 320ms cubic-bezier(0.22, 1, 0.36, 1)";
          el.style.height = `${endHeight}px`;
        });

        const cleanup = () => {
          el.removeEventListener("transitionend", onEnd);
          if (el._heightTransitionToken !== token) return;
          el.style.transition = "";
          el.style.height = "";
          el.style.overflow = "";
        };
        const onEnd = (event) => {
          if (event.target !== el || event.propertyName !== "height") return;
          cleanup();
        };
        el.addEventListener("transitionend", onEnd);
        // Safety net: guarantees cleanup even if transitionend never fires
        // (e.g. the transition gets interrupted by another toggle).
        window.setTimeout(cleanup, 420);
      }

      function renderFields() {
        const fields = document.querySelector("#fields");
        const values = state.values[state.mode];
        fields.innerHTML = "";

        const updateRangeProgress = (range) => {
          const min = Number(range.min || 0);
          const max = Number(range.max || 100);
          const value = Number(range.value || 0);
          const progress = max > min ? ((value - min) / (max - min)) * 100 : 0;
          range.style.setProperty("--range-progress", `${Math.max(0, Math.min(100, progress))}%`);
        };

        const renderNumberField = (field, options = {}) => {
          const label = document.createElement("label");
          label.className = options.mini ? "tool-fee-rate" : "tool-field";

          const span = document.createElement("span");
          span.textContent = field.label;
          label.append(span);

          const control = document.createElement("div");
          control.className = "tool-input-wrap";
          const input = document.createElement("input");
          input.type = "text";
          input.inputMode = "decimal";
          input.min = field.min;
          input.max = field.max;
          input.step = field.step;
          input.value = formatInputNumber(values[field.key]);
          const range = document.createElement("input");
          range.className = options.mini ? "tool-range tool-range-mini" : "tool-range";
          range.type = "range";
          range.min = field.min;
          range.max = field.max;
          range.step = field.step;
          range.value = values[field.key];
          updateRangeProgress(range);

          const note = field.note ? document.createElement("small") : null;
          const updateNote = () => {
            if (!note) return;
            note.textContent = typeof field.note === "function" ? field.note(values) : field.note;
          };
          const updatePresets = () => {
            if (!presetRow) return;
            presetRow.querySelectorAll(".tool-preset").forEach((button) => {
              button.classList.toggle("is-active", values[field.key] === Number(button.dataset.value));
            });
          };

          input.addEventListener("input", () => {
            values[field.key] = parseInputNumber(input.value);
            range.value = values[field.key];
            updateRangeProgress(range);
            updateNote();
            updatePresets();
            renderOutputs();
          });
          input.addEventListener("blur", () => {
            input.value = formatInputNumber(values[field.key]);
          });
          range.addEventListener("input", () => {
            values[field.key] = Number(range.value || 0);
            input.value = formatInputNumber(values[field.key]);
            updateRangeProgress(range);
            updateNote();
            updatePresets();
            renderOutputs();
          });
          const suffix = document.createElement("small");
          suffix.textContent = field.suffix;
          control.append(input, suffix);
          label.append(control);

          let presetRow = null;
          if (field.presets) {
            presetRow = document.createElement("div");
            presetRow.className = "tool-presets";
            field.presets.forEach((preset) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "tool-preset";
              button.dataset.value = preset;
              button.textContent = `${preset} ${field.suffix}`;
              button.classList.toggle("is-active", values[field.key] === preset);
              button.addEventListener("click", () => {
                values[field.key] = preset;
                input.value = formatInputNumber(values[field.key]);
                range.value = values[field.key];
                updateRangeProgress(range);
                updateNote();
                updatePresets();
                renderOutputs();
              });
              presetRow.append(button);
            });
            label.append(presetRow);
          }

          label.append(range);

          if (note) {
            note.className = "tool-field-note";
            updateNote();
            label.append(note);
          }

          return label;
        };

        const renderFees = () => {
          const feeGroup = document.createElement("div");
          feeGroup.className = "tool-fee-group";

          [
            {
              toggleKey: "fraisEntreeActifs",
              valueKey: "fraisEntree",
              label: "Droits d'entrée",
              rateLabel: "Taux",
              max: 4.8
            },
            {
              toggleKey: "fraisActifs",
              valueKey: "frais",
              label: "Frais de gestion",
              rateLabel: "Taux annuel",
              max: 3
            }
          ].forEach((fee) => {
            const card = document.createElement("div");
            card.className = "tool-fee-card";
            const toggle = document.createElement("label");
            toggle.className = "tool-fee-toggle";
            const title = document.createElement("span");
            title.textContent = fee.label;
            const input = document.createElement("input");
            input.type = "checkbox";
            input.checked = values[fee.toggleKey];
            input.addEventListener("change", () => {
              values[fee.toggleKey] = input.checked;
              withHeightTransition(document.querySelector(".tool-params"), () => {
                renderFields();
                renderOutputs();
              });
            });
            toggle.append(title, input);
            card.append(toggle);

            if (values[fee.toggleKey]) {
              card.append(renderNumberField({
                key: fee.valueKey,
                label: fee.rateLabel,
                type: "number",
                min: 0,
                max: fee.max,
                step: 0.1,
                suffix: "%"
              }, { mini: true }));
            }

            feeGroup.append(card);
          });

          fields.append(feeGroup);
        };

        fieldDefinitions[state.mode].forEach((field) => {
          if (field.dependsOn && !values[field.dependsOn]) return;
          if (state.mode === "av" && ["fraisEntreeActifs", "fraisEntree", "fraisActifs", "frais"].includes(field.key)) return;

          if (field.type !== "checkbox") {
            fields.append(renderNumberField(field));
            return;
          }

          const label = document.createElement("label");
          label.className = "tool-switch-row";

          const span = document.createElement("span");
          span.textContent = field.label;
          label.append(span);

          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = values[field.key];
          input.addEventListener("change", () => {
            values[field.key] = input.checked;
            withHeightTransition(document.querySelector(".tool-params"), render);
          });
          label.append(input);

          fields.append(label);

          if (field.checkedNote && values[field.key]) {
            const note = document.createElement("small");
            note.className = "tool-field-note";
            note.textContent = field.checkedNote;
            fields.append(note);
          }
        });

        if (state.mode === "av") renderFees();
      }

      function renderSummary(rows) {
        const last = rows.at(-1) || {};
        const summary = document.querySelector("#summary");

          const multiple = effortMensuel > 0 ? loyerMensuelFin / effortMensuel : 0;

          const loyerAmount = formatMoney(loyerMensuelFin).replace(/\s?€$/, "");

                <div>
                  <span>Revenu mensuel viager</span>
                  <strong class="capital-amount value-update"><span>${loyerAmount}</span><span class="capital-currency">€/mois</span></strong>

                  <strong class="value-update">× ${multiple.toFixed(2)}</strong>

              <div class="capital-gauge">
                <div class="capital-breakdown-labels">
                  <span class="capital-metric-invested">Effort d'épargne</span>
                  <span class="capital-metric-interest">Revenu viager obtenu</span>

                <div class="capital-breakdown" aria-label="Comparaison entre l'effort d'épargne et le revenu viager obtenu">
                  <div style="width:${previousGauge.effortShare}%"></div>

      function renderBreakEvenChart(rows) {
        const chart = document.querySelector("#chart");
        const width = 960;
        const height = 380;
        const pad = { top: 28, right: 36, bottom: 54, left: 128 };
        const values = state.values.scpi;

        const apportsSeries = scpiApportsSeries(values, rows);
        const loyersSeries = rows.map((row) => row.revenusCumules || 0);
        const capitalSeries = rows.map((row) => row.capital || 0);
        const breakEvenYear = scpiBreakEvenYear(rows, apportsSeries);
        const breakEvenIndex = breakEvenYear ? rows.findIndex((row) => row.annee === breakEvenYear) : -1;

        const scaleSeries = state.scpiShowCapital ? [...apportsSeries, ...loyersSeries, ...capitalSeries] : [...apportsSeries, ...loyersSeries];
        const max = Math.max(...scaleSeries, 1);
        const x = (index) => pad.left + (index / Math.max(rows.length - 1, 1)) * (width - pad.left - pad.right);
        const y = (value) => height - pad.bottom - (value / max) * (height - pad.top - pad.bottom);
        const pointsFor = (series) => series.map((value, index) => `${x(index)},${y(value)}`).join(" ");
        const areaBetween = (lowerSeries, upperSeries, from, to) => {
          if (to <= from) return "";
          const top = [];
          const bottom = [];
          for (let i = from; i <= to; i++) top.push(`${x(i)},${y(upperSeries[i])}`);
          for (let i = to; i >= from; i--) bottom.push(`${x(i)},${y(lowerSeries[i])}`);
          return `M${top.join(" L")} L${bottom.join(" L")} Z`;
        };

        const splitAt = breakEvenIndex >= 0 ? breakEvenIndex : rows.length - 1;
        const deficitPath = areaBetween(loyersSeries, apportsSeries, 0, splitAt);
        const surplusPath = breakEvenIndex >= 0 ? areaBetween(apportsSeries, loyersSeries, splitAt, rows.length - 1) : "";

        const grid = niceValueTicks(max, 4).map((value) => {
          const lineY = y(value);
          return `
            <g>
              <line x1="${pad.left}" y1="${lineY}" x2="${width - pad.right}" y2="${lineY}" />
              <text x="${pad.left - 16}" y="${lineY + 5}">${formatMoney(value)}</text>
            </g>
          `;
        }).join("");
        const ticks = niceYearTicks(rows.length).map((annee) => {
          const tickX = x(annee - 1);
          return `<text x="${tickX}" y="${height - 10}">${annee}</text>`;
        }).join("");

        let marker = "";
        if (breakEvenIndex >= 0) {
          const markerX = x(breakEvenIndex);
          const markerY = y(loyersSeries[breakEvenIndex]);
          const plotWidth = width - pad.left - pad.right;
          const labelAnchor = (markerX - pad.left) > plotWidth / 2 ? "end" : "start";
          const labelX = markerX + (labelAnchor === "end" ? -10 : 10);
          marker = `
            <g class="chart-marker">
              <line class="chart-marker-line" x1="${markerX}" y1="${pad.top}" x2="${markerX}" y2="${height - pad.bottom}"></line>
              <circle class="chart-marker-dot" cx="${markerX}" cy="${markerY}" r="5"></circle>
              <text class="chart-marker-label" x="${labelX}" y="${pad.top + 14}" text-anchor="${labelAnchor}">Point de bascule — année ${breakEvenYear}</text>
            </g>
          `;
        }

        const last = rows.at(-1) || {};

        chart.innerHTML = `
          <div class="chart-totals">
            <span>Point de bascule <strong>${breakEvenYear ? `Année ${breakEvenYear}` : "Non atteint"}</strong></span>
            <span class="capital-metric-invested">Total versé <strong>${formatMoney(apportsSeries.at(-1))}</strong></span>
            <span class="capital-metric-interest">Total des loyers perçus <strong>${formatMoney(last.revenusCumules)}</strong></span>
          </div>
          <div class="chart-toggle">
            <label>
              <input type="checkbox" id="toggle-capital-line" ${state.scpiShowCapital ? "checked" : ""}>
              <span>Afficher la valeur du capital</span>
            </label>
          </div>
          <div class="chart-canvas">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Comparaison entre le total versé et le total des loyers perçus">
              <defs>
                <linearGradient id="chartAreaInvested" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#6f8ba7" stop-opacity="0.5"></stop>
                  <stop offset="100%" stop-color="#6f8ba7" stop-opacity="0.05"></stop>
                </linearGradient>
                <linearGradient id="chartAreaGains" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#b99761" stop-opacity="0.55"></stop>
                  <stop offset="100%" stop-color="#b99761" stop-opacity="0.08"></stop>
                </linearGradient>
              </defs>
              <g class="chart-grid">${grid}</g>
              <path class="chart-area chart-area-invested" d="${deficitPath}"></path>
              <path class="chart-area chart-area-gains" d="${surplusPath}"></path>
              <polyline class="chart-line chart-line-invested" points="${pointsFor(apportsSeries)}"></polyline>
              <polyline class="chart-line chart-line-gains" points="${pointsFor(loyersSeries)}"></polyline>
              ${state.scpiShowCapital ? `<polyline class="chart-line chart-line-capital" points="${pointsFor(capitalSeries)}"></polyline>` : ""}
              <g class="chart-axis">${ticks}</g>
              ${marker}
              <g class="chart-hover">
                <line class="chart-hover-line" x1="0" y1="${pad.top}" x2="0" y2="${height - pad.bottom}"></line>
                <circle class="chart-hover-dot chart-hover-dot-invested" r="4"></circle>
                <circle class="chart-hover-dot chart-hover-dot-gains" r="4"></circle>
                ${state.scpiShowCapital ? `<circle class="chart-hover-dot chart-hover-dot-capital" r="4"></circle>` : ""}
              </g>
            </svg>
            <div class="chart-tooltip">
              <span class="chart-tooltip-year"></span>
              <div class="chart-tooltip-row chart-tooltip-invested"><small>Total versé</small><strong></strong></div>
              <div class="chart-tooltip-row chart-tooltip-gains"><small>Total loyers perçus</small><strong></strong></div>
              ${state.scpiShowCapital ? `<div class="chart-tooltip-row chart-tooltip-capital"><small>Valeur du capital</small><strong></strong></div>` : ""}
            </div>
          </div>
          <div class="chart-legend">
            <span><i class="legend-invested"></i>Total versé</span>
            <span><i class="legend-gains"></i>Total des loyers perçus</span>
            ${state.scpiShowCapital ? `<span><i class="legend-capital"></i>Valeur du capital</span>` : ""}
          </div>
        `;

        chart.querySelector("#toggle-capital-line").addEventListener("change", (event) => {
          state.scpiShowCapital = event.target.checked;
          renderBreakEvenChart(rows);
        });

        setupBreakEvenHover(chart, rows, { x, y, pad, width, apportsSeries, loyersSeries, capitalSeries });
      }

      function setupBreakEvenHover(chart, rows, ctx) {
        const svg = chart.querySelector("svg");
        const canvas = chart.querySelector(".chart-canvas");
        const hoverGroup = chart.querySelector(".chart-hover");
        const hoverLine = chart.querySelector(".chart-hover-line");
        const hoverDotApports = chart.querySelector(".chart-hover-dot-invested");
        const hoverDotLoyers = chart.querySelector(".chart-hover-dot-gains");
        const hoverDotCapital = chart.querySelector(".chart-hover-dot-capital");
        const tooltip = chart.querySelector(".chart-tooltip");
        const tooltipYear = chart.querySelector(".chart-tooltip-year");
        const tooltipApports = chart.querySelector(".chart-tooltip-invested strong");
        const tooltipLoyers = chart.querySelector(".chart-tooltip-gains strong");
        const tooltipCapital = chart.querySelector(".chart-tooltip-capital strong");
        if (!svg || !rows.length) return;

        hoverGroup.style.display = "none";
        tooltip.hidden = true;

        const updateAt = (clientX, clientY) => {
          const point = svg.createSVGPoint();
          point.x = clientX;
          point.y = clientY;
          const ctm = svg.getScreenCTM();
          if (!ctm) return;
          const local = point.matrixTransform(ctm.inverse());
          const ratio = (local.x - ctx.pad.left) / (ctx.width - ctx.pad.left - ctx.pad.right);
          const index = Math.max(0, Math.min(rows.length - 1, Math.round(ratio * (rows.length - 1))));
          const row = rows[index];
          const px = ctx.x(index);
          const apportsY = ctx.y(ctx.apportsSeries[index]);
          const loyersY = ctx.y(ctx.loyersSeries[index]);

          hoverGroup.style.display = "";
          hoverLine.setAttribute("x1", px);
          hoverLine.setAttribute("x2", px);
          hoverDotApports.setAttribute("cx", px);
          hoverDotApports.setAttribute("cy", apportsY);
          hoverDotLoyers.setAttribute("cx", px);
          hoverDotLoyers.setAttribute("cy", loyersY);
          if (hoverDotCapital) {
            hoverDotCapital.setAttribute("cx", px);
            hoverDotCapital.setAttribute("cy", ctx.y(ctx.capitalSeries[index]));
          }

          tooltipYear.textContent = `Année ${row.annee}`;
          tooltipApports.textContent = formatMoney(roundToHundred(ctx.apportsSeries[index]));
          tooltipLoyers.textContent = formatMoney(roundToHundred(ctx.loyersSeries[index]));
          if (tooltipCapital) tooltipCapital.textContent = formatMoney(roundToHundred(ctx.capitalSeries[index]));

          const screenPoint = svg.createSVGPoint();
          screenPoint.x = px;
          screenPoint.y = Math.min(apportsY, loyersY);
          const screenPos = screenPoint.matrixTransform(ctm);
          const canvasRect = canvas.getBoundingClientRect();
          tooltip.hidden = false;
          tooltip.style.left = `${screenPos.x - canvasRect.left}px`;
          tooltip.style.top = `${screenPos.y - canvasRect.top}px`;
        };

        const hide = () => {
          hoverGroup.style.display = "none";
          tooltip.hidden = true;
        };

        svg.addEventListener("mousemove", (event) => updateAt(event.clientX, event.clientY));
        svg.addEventListener("mouseleave", hide);
        svg.addEventListener("touchmove", (event) => {
          const touch = event.touches[0];
          if (touch) updateAt(touch.clientX, touch.clientY);
        }, { passive: true });
        svg.addEventListener("touchend", hide);
      }

      function renderChart(rows) {
        if (state.mode === "scpi") {
          renderBreakEvenChart(rows);
          return;
        }

        const chart = document.querySelector("#chart");
        const width = 960;
        const height = 380;
        const pad = { top: 28, right: 36, bottom: 54, left: 128 };
        const metric = state.mode === "av" ? "interetsCumules" : "gainsCumules";
        const metricLabel = state.mode === "av" ? "Intérêts gagnés" : "Gains cumulés";

        const investedSeries = rows.map((row) => Math.max(0, row.versementsCumules || 0));
        const capitalSeries = rows.map((row, i) => Math.max(investedSeries[i], row.capital || 0));
        const max = Math.max(...capitalSeries, 1);

        const x = (index) => pad.left + (index / Math.max(rows.length - 1, 1)) * (width - pad.left - pad.right);
        const y = (value) => height - pad.bottom - (value / max) * (height - pad.top - pad.bottom);
        const pointsFor = (series) => series.map((value, index) => `${x(index)},${y(value)}`).join(" ");
        const areaPath = (lowerSeries, upperSeries) => {
          const top = upperSeries.map((value, index) => `${x(index)},${y(value)}`);
          const bottom = lowerSeries.map((value, index) => `${x(index)},${y(value)}`).reverse();
          return `M${top.join(" L")} L${bottom.join(" L")} Z`;
        };
        const zeroSeries = rows.map(() => 0);

        const grid = niceValueTicks(max, 4).map((value) => {
          const lineY = y(value);
          return `
            <g>
              <line x1="${pad.left}" y1="${lineY}" x2="${width - pad.right}" y2="${lineY}" />
              <text x="${pad.left - 16}" y="${lineY + 5}">${formatMoney(value)}</text>
            </g>
          `;
        }).join("");
        const ticks = niceYearTicks(rows.length).map((annee) => {
          const tickX = x(annee - 1);
          return `<text x="${tickX}" y="${height - 10}">${annee}</text>`;
        }).join("");

        chart.innerHTML = `
          <div class="chart-totals">
            <span>Capital final <strong>${formatMoney(rows.at(-1)?.capital)}</strong></span>
            <span class="capital-metric-invested">Sommes investies <strong>${formatMoney(rows.at(-1)?.versementsCumules)}</strong></span>
            <span class="capital-metric-interest">${metricLabel} <strong>${formatMoney(rows.at(-1)?.[metric])}</strong></span>
          </div>
          <div class="chart-canvas">
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Evolution annuelle du capital, des intérêts et des sommes investies">
              <defs>
                <linearGradient id="chartAreaInvested" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#6f8ba7" stop-opacity="0.5"></stop>
                  <stop offset="100%" stop-color="#6f8ba7" stop-opacity="0.05"></stop>
                </linearGradient>
                <linearGradient id="chartAreaGains" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#b99761" stop-opacity="0.55"></stop>
                  <stop offset="100%" stop-color="#b99761" stop-opacity="0.08"></stop>
                </linearGradient>
              </defs>
              <g class="chart-grid">${grid}</g>
              <path class="chart-area chart-area-invested" d="${areaPath(zeroSeries, investedSeries)}"></path>
              <path class="chart-area chart-area-gains" d="${areaPath(investedSeries, capitalSeries)}"></path>
              <polyline class="chart-line chart-line-invested" points="${pointsFor(investedSeries)}"></polyline>
              <polyline class="chart-line chart-line-capital" points="${pointsFor(capitalSeries)}"></polyline>
              <g class="chart-axis">${ticks}</g>
              <g class="chart-hover">
                <line class="chart-hover-line" x1="0" y1="${pad.top}" x2="0" y2="${height - pad.bottom}"></line>
                <circle class="chart-hover-dot chart-hover-dot-invested" r="4"></circle>
                <circle class="chart-hover-dot chart-hover-dot-capital" r="4"></circle>
              </g>
            </svg>
            <div class="chart-tooltip">
              <span class="chart-tooltip-year"></span>
              <div class="chart-tooltip-row chart-tooltip-capital"><small>Capital</small><strong></strong></div>
              <div class="chart-tooltip-row chart-tooltip-gains"><small>${metricLabel}</small><strong></strong></div>
              <div class="chart-tooltip-row chart-tooltip-invested"><small>Sommes investies</small><strong></strong></div>
            </div>
          </div>
          <div class="chart-legend">
            <span><i class="legend-capital"></i>Capital final</span>
            <span><i class="legend-gains"></i>${metricLabel}</span>
            <span><i class="legend-invested"></i>Sommes investies</span>
          </div>
        `;

        setupChartHover(chart, rows, { x, y, pad, width, height, investedSeries, capitalSeries, metric });
      }

      function setupChartHover(chart, rows, ctx) {
        const svg = chart.querySelector("svg");
        const canvas = chart.querySelector(".chart-canvas");
        const hoverGroup = chart.querySelector(".chart-hover");
        const hoverLine = chart.querySelector(".chart-hover-line");
        const hoverDotCapital = chart.querySelector(".chart-hover-dot-capital");

        const tooltipCapital = chart.querySelector(".chart-tooltip-capital strong");
        const tooltipGains = chart.querySelector(".chart-tooltip-gains strong");
        const tooltipInvested = chart.querySelector(".chart-tooltip-invested strong");
        if (!svg || !rows.length) return;

        hoverGroup.style.display = "none";
        tooltip.hidden = true;

        const updateAt = (clientX, clientY) => {
          const point = svg.createSVGPoint();

          if (!ctm) return;

          const ratio = (local.x - ctx.pad.left) / (ctx.width - ctx.pad.left - ctx.pad.right);
          const index = Math.max(0, Math.min(rows.length - 1, Math.round(ratio * (rows.length - 1))));
          const row = rows[index];
          const px = ctx.x(index);
          const capitalY = ctx.y(ctx.capitalSeries[index]);
          const investedY = ctx.y(ctx.investedSeries[index]);

          hoverGroup.style.display = "";
          hoverLine.setAttribute("x1", px);
          hoverLine.setAttribute("x2", px);
          hoverDotCapital.setAttribute("cx", px);
          hoverDotCapital.setAttribute("cy", capitalY);
          hoverDotInvested.setAttribute("cx", px);
          hoverDotInvested.setAttribute("cy", investedY);

          tooltipYear.textContent = `Année ${row.annee}`;
          tooltipCapital.textContent = formatMoney(roundToHundred(row.capital));
          tooltipGains.textContent = formatMoney(roundToHundred(row[ctx.metric]));
          tooltipInvested.textContent = formatMoney(roundToHundred(row.versementsCumules));

          const screenPoint = svg.createSVGPoint();
          screenPoint.x = px;
          screenPoint.y = capitalY;
          const screenPos = screenPoint.matrixTransform(ctm);
          const canvasRect = canvas.getBoundingClientRect();
          tooltip.hidden = false;
          tooltip.style.left = `${screenPos.x - canvasRect.left}px`;
          tooltip.style.top = `${screenPos.y - canvasRect.top}px`;
        };

        const hide = () => {
          hoverGroup.style.display = "none";
          tooltip.hidden = true;
        };

        svg.addEventListener("mousemove", (event) => updateAt(event.clientX, event.clientY));
        svg.addEventListener("mouseleave", hide);
        svg.addEventListener("touchmove", (event) => {
          const touch = event.touches[0];
          if (touch) updateAt(touch.clientX, touch.clientY);
        }, { passive: true });
        svg.addEventListener("touchend", hide);
      }

      function renderPie(rows) {
        const panel = document.querySelector("#pie");
        const last = rows.at(-1) || {};
        const metric = state.mode === "scpi" ? "revenusCumules" : state.mode === "av" ? "interetsCumules" : "gainsCumules";
        const metricLabel = state.mode === "scpi" ? "Loyers cumulés" : state.mode === "av" ? "Intérêts gagnés" : "Gains cumulés";

        const invested = Math.max(0, last.versementsCumules || 0);
        const gains = Math.max(0, last[metric] || 0);
        const total = invested + gains || 1;
        const investedShare = (invested / total) * 100;
        const gainsShare = 100 - investedShare;

        const size = 340;
        const strokeWidth = 40;
        const radius = (size - strokeWidth) / 2;
        const circumference = 2 * Math.PI * radius;
        const segmentGap = 8;
        const investedFull = (investedShare / 100) * circumference;
        const gainsFull = circumference - investedFull;
        const investedDrawn = Math.max(0, investedFull - segmentGap);
        const gainsDrawn = Math.max(0, gainsFull - segmentGap);
        const investedOffset = segmentGap / 2;
        const gainsOffset = investedFull + segmentGap / 2;
        const capitalAmount = formatMoney(last.capital).replace(/\s?€$/, "");

        panel.innerHTML = `
          <div class="pie-layout">
            <div class="pie-canvas">
              <svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Répartition du capital final entre sommes investies et ${metricLabel.toLowerCase()}">
                <defs>
                  <linearGradient id="pieInvested" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#6f8ba7"></stop>
                    <stop offset="100%" stop-color="#9eb2c4"></stop>
                  </linearGradient>
                  <linearGradient id="pieGains" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#b99761"></stop>
                    <stop offset="100%" stop-color="#dfcba8"></stop>
                  </linearGradient>
                </defs>
                <circle class="pie-track" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}"></circle>
                <circle class="pie-segment pie-segment-invested" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}"
                  stroke-dasharray="${investedDrawn} ${circumference - investedDrawn}" stroke-dashoffset="${-investedOffset}"></circle>
                <circle class="pie-segment pie-segment-gains" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}"
                  stroke-dasharray="${gainsDrawn} ${circumference - gainsDrawn}" stroke-dashoffset="${-gainsOffset}"></circle>
              </svg>
              <div class="pie-center">
                <span>Capital final</span>
                <strong><span>${capitalAmount}</span><small>€</small></strong>
              </div>
            </div>
            <div class="pie-legend">
              <div class="pie-legend-row pie-legend-invested">
                <i></i>
                <div class="pie-legend-copy">
                  <span>Sommes investies</span>
                  <strong>${formatMoney(invested)}</strong>
                </div>
                <small>${formatNumber(investedShare)} %</small>
              </div>
              <div class="pie-legend-row pie-legend-gains">
                <i></i>
                <div class="pie-legend-copy">
                  <span>${metricLabel}</span>
                  <strong>${formatMoney(gains)}</strong>
                </div>
                <small>${formatNumber(gainsShare)} %</small>
              </div>
            </div>
          </div>
        `;
      }

      const SCPI_TABLE_YEARS = [1, 2, 3, 4, 5, 10, 15, 20, 30, 40, 50, 60, 70, 80];

      function renderTable(rows) {
        const table = document.querySelector("#projection-table");
        let headers;
        let mapper;
        let displayRows = rows;
        if (state.mode === "scpi") {
          headers = ["Année", "Versements", "Loyer mensuel", "Loyer annuel", "Loyers cumulés", "Capital"];
          mapper = (row) => [row.annee, formatMoney(row.versementsCumules), formatMoney(row.revenuMensuel), formatMoney(row.revenuAnnuel), formatMoney(row.revenusCumules), formatMoney(row.capital)];
          const milestones = new Set(SCPI_TABLE_YEARS.filter((year) => year <= rows.length));
          if (rows.length) milestones.add(rows.length);
          displayRows = rows.filter((row) => milestones.has(row.annee));
        } else if (state.mode === "av") {
          headers = ["Année", "Versements", "Intérêts annuels", "Intérêts cumulés", "Capital"];
          mapper = (row) => [row.annee, formatMoney(row.versementsCumules), formatMoney(row.interetsAnnuels), formatMoney(row.interetsCumules), formatMoney(row.capital)];
        } else {
          headers = ["Année", "Versements", "Gains annuels", "Gains cumulés", "Capital"];
          mapper = (row) => [row.annee, formatMoney(row.versementsCumules), formatMoney(row.gainsAnnuels), formatMoney(row.gainsCumules), formatMoney(row.capital)];
        }

        table.innerHTML = `
          <thead><tr>${headers.map((head) => `<th>${head}</th>`).join("")}</tr></thead>
          <tbody>${displayRows.map((row) => `<tr>${mapper(row).map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody>
        `;
      }

      const PS_RATE = 17.2;
      const TMI_BRACKETS = [0, 11, 30, 41, 45];

      function computeFiscalImpact(revenuAnnuelBrut, tmi) {
        const irAmount = revenuAnnuelBrut * (tmi / 100);
        const psAmount = revenuAnnuelBrut * (PS_RATE / 100);
        return {
          francaise: {
            irShare: tmi,
            psShare: PS_RATE,
            irAmount,
            psAmount,
            totalRate: tmi + PS_RATE,
            net: revenuAnnuelBrut - irAmount - psAmount
          },
          etrangere: {
            irShare: tmi,
            psShare: 0,
            irAmount,
            psAmount: 0,
            totalRate: tmi,
            net: revenuAnnuelBrut - irAmount
          }
        };
      }

      function fiscalDonut(irShare, psShare, label) {
        const size = 176;
        const strokeWidth = 22;
        const radius = (size - strokeWidth) / 2;
        const circumference = 2 * Math.PI * radius;
        const gap = 5;
        let cursor = 0;
        const parts = [
          { share: irShare, className: "fiscal-donut-ir" },
          { share: psShare, className: "fiscal-donut-ps" }
        ];
        const circles = parts.map((part) => {
          if (part.share <= 0) return "";
          const full = (part.share / 100) * circumference;
          const hasGap = part.share < 100;
          const drawn = Math.max(0, full - (hasGap ? gap : 0));
          const offset = cursor + (hasGap ? gap / 2 : 0);
          cursor += full;
          return `<circle class="fiscal-donut-segment ${part.className}" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}" stroke-dasharray="${drawn} ${circumference - drawn}" stroke-dashoffset="${-offset}"></circle>`;
        }).join("");
        return `
          <svg viewBox="0 0 ${size} ${size}" class="fiscal-donut" role="img" aria-label="${label}">
            <circle class="fiscal-donut-track" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${strokeWidth}"></circle>
            ${circles}
          </svg>
        `;
      }

      function fiscalCard(title, data, hasPS) {
        return `
          <div class="fiscal-card${hasPS ? "" : " fiscal-card-foreign"}">
            <h3>${title}</h3>
            <div class="fiscal-donut-wrap">
              ${fiscalDonut(data.irShare, data.psShare, `Taux d'imposition : ${formatPercent(data.totalRate)} %`)}
              <div class="fiscal-donut-center">
                <strong>${formatPercent(data.totalRate)} %</strong>
                <span>imposition</span>
              </div>
            </div>
            <ul class="fiscal-breakdown">
              <li class="fiscal-line-ir"><span>Impôt sur le revenu (${formatPercent(data.irShare)} %)</span><strong>${formatMoney(data.irAmount)}</strong></li>
              <li class="fiscal-line-ps${hasPS ? "" : " fiscal-line-void"}"><span>Prélèvements sociaux${hasPS ? ` (${formatPercent(PS_RATE)} %)` : ""}</span><strong>${hasPS ? formatMoney(data.psAmount) : "Supprimés"}</strong></li>
              <li class="fiscal-line-net"><span>Loyer net</span><strong>${formatMoney(data.net)}</strong></li>
            </ul>
          </div>
        `;
      }

      function renderFiscal(rows) {
        const panel = document.querySelector("#fiscal");
        const values = state.values.scpi;
        const last = rows.at(-1) || {};
        const revenuAnnuelBrut = last.revenuAnnuel || 0;
        const impact = computeFiscalImpact(revenuAnnuelBrut, values.tmi);
        const gainAnnuel = impact.francaise.psAmount;

        panel.innerHTML = `
          <p class="fiscal-intro">
            Illustration sur le loyer annuel brut de l'année ${rows.length} (${formatMoney(revenuAnnuelBrut)}), selon votre tranche marginale d'imposition.
          </p>
          <div class="fiscal-tmi">
            <span>Tranche marginale d'imposition (TMI)</span>
            <div class="tool-presets">
              ${TMI_BRACKETS.map((t) => `<button type="button" class="tool-preset${values.tmi === t ? " is-active" : ""}" data-tmi="${t}">${t} %</button>`).join("")}
            </div>
          </div>
          <div class="fiscal-compare">
            ${fiscalCard("SCPI françaises", impact.francaise, true)}
            ${fiscalCard("SCPI européennes / étrangères", impact.etrangere, false)}
          </div>
          <div class="fiscal-gain">
            <p>
              En optant pour des SCPI de sources étrangères (zone européenne, via convention fiscale), vous économiseriez environ
              <strong>${formatMoney(gainAnnuel)}</strong> par an de prélèvements sociaux sur ce loyer, soit
              <strong>${formatMoney(gainAnnuel / 12)}</strong> de plus par mois dans votre poche, à rendement égal.
            </p>
          </div>
          <p class="fiscal-disclaimer">
            Simplification illustrative du mécanisme du taux effectif applicable à certaines SCPI investies hors de France
            (Allemagne, Pays-Bas, Espagne…) : selon la convention fiscale applicable, les prélèvements sociaux ne s'appliquent
            pas aux revenus fonciers de source étrangère, seul l'impôt sur le revenu reste dû. Cette estimation ne remplace
            pas une étude fiscale personnalisée.
          </p>
        `;

        panel.querySelectorAll(".tool-preset").forEach((button) => {
          button.addEventListener("click", () => {
            values.tmi = Number(button.dataset.tmi);
            renderFiscal(rows);
          });
        });
      }

      function renderOutputs() {
        const rows = rowsForMode();
        const content = modeContent[state.mode];
        document.title = `${content.title} | Simulateur`;
        document.querySelector("#tool-page-title").textContent = content.title;
        document.querySelector(".tool-card-title h2").textContent = content.chartTitle;
        renderSummary(rows);
        renderChart(rows);
        renderPie(rows);
        renderTable(rows);
        if (state.mode === "scpi") renderFiscal(rows);
      }

      function render() {
        renderFields();
        renderOutputs();
      }

      document.querySelector("#reset-fields").addEventListener("click", () => {
        const values = state.values[state.mode];
        fieldDefinitions[state.mode].forEach((field) => {
          if (field.type === "number") values[field.key] = 0;
        });
        withHeightTransition(document.querySelector(".tool-params"), render);
      });

      if (state.mode === "scpi") {
        document.querySelector("#fiscal-view-button").hidden = false;
      }

      document.querySelectorAll(".tool-view-toggle button").forEach((button) => {
        button.addEventListener("click", () => {
          const applyView = () => {
            state.view = button.dataset.view;
            document.querySelectorAll(".tool-view-toggle button").forEach((item) => {
              item.classList.toggle("is-active", item === button);
            });
            document.querySelector("#chart-panel").hidden = state.view !== "chart";
            document.querySelector("#pie-panel").hidden = state.view !== "pie";
            document.querySelector("#table-panel").hidden = state.view !== "table";
            document.querySelector("#fiscal-panel").hidden = state.view !== "fiscal";
          };
          if (document.startViewTransition) {
            document.startViewTransition(applyView);
          } else {
            applyView();
          }
        });
      });

      render();
    </script>
  </body>
</html>
